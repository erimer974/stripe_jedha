<svg viewBox="0 0 980 730" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Flux des données par couche — table par table (v2)</title>
  <desc>Sources : OLTP (transactions, customers, merchants, payment_methods), API de paiement, applications, fichiers de référence CSV. Kafka : topics cdc.oltp.* publiés par Debezium (email exclu), events.risk_features et fraud.scores publiés par l'API, events.sessions, events.feedback et logs.app publiés par les applications. Couche raw de l'entrepôt alimentée en continu par le consommateur sink-raw (rôle loader), ml.fraud_scores par sink-ml (rôle ml_scorer), MongoDB par sink-mongodb (rôle el_loader) ; référentiels chargés par lots ; messages et lignes invalides dans raw._quarantine. dbt (rôle transformer) construit stg_transactions puis l'étoile analytics et la quarantaine métier. Le rattrapage score les transactions restées sans score ; la BI lit analytics seulement ; l'audit lit tout en lecture seule.</desc>

  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#5b6472" stroke-width="1.5" fill="none"/>
    </marker>
    <marker id="arrF" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#6b4fa0" stroke-width="1.6" fill="none"/>
    </marker>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#017cee" stroke-width="1.6" fill="none"/>
    </marker>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#b23b3b" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <rect width="980" height="730" fill="#f8f9fa" rx="12"/>
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Flux des données par couche — table par table (v2)</text>
  <text x="490" y="50" text-anchor="middle" font-size="11" fill="#868e96">Où vit chaque donnée, qui la déplace, avec quel rôle · la clé transaction_id relie toutes les couches · noms de la maquette (identiques dans la cible)</text>

  <g font-size="9.5" font-weight="700" fill="#adb5bd" letter-spacing="1" text-anchor="middle">
    <text x="102" y="76">SOURCES</text>
    <text x="290" y="76">KAFKA</text>
    <text x="485" y="76">RAW + NoSQL</text>
    <text x="680" y="76">STAGING · ML</text>
    <text x="872" y="76">ANALYTICS</text>
  </g>

  <!-- ===================== flèches ===================== -->
  <g fill="none" stroke="#6b4fa0" stroke-width="1.6">
    <path d="M 185,133 H 213" marker-end="url(#arrF)"/>
    <path d="M 185,246 H 213" marker-end="url(#arrF)"/>
    <path d="M 185,306 H 213" marker-end="url(#arrF)"/>
    <path d="M 365,133 H 393" marker-end="url(#arrF)"/>
    <path d="M 365,250 H 603" marker-end="url(#arrF)"/>
    <path d="M 365,316 H 393" marker-end="url(#arrF)"/>
  </g>
  <g fill="none" stroke="#017cee" stroke-width="1.6">
    <path d="M 185,422 H 393" marker-end="url(#arrB)"/>
    <path d="M 575,118 H 603" marker-end="url(#arrB)"/>
    <path d="M 755,118 H 783" marker-end="url(#arrB)"/>
    <path d="M 680,234 V 152" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
    <path d="M 872,282 V 503" marker-end="url(#arrB)"/>
    <path d="M 680,503 V 292" marker-end="url(#arrB)"/>
  </g>
  <path d="M 300,330 V 471 H 393" fill="none" stroke="#b23b3b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrR)"/>

  <!-- numéros -->
  <g font-size="9" font-weight="700" text-anchor="middle">
    <g fill="#6b4fa0"><circle cx="199" cy="133" r="8"/><circle cx="199" cy="246" r="8"/><circle cx="199" cy="306" r="8"/><circle cx="379" cy="133" r="8"/><circle cx="379" cy="250" r="8"/><circle cx="379" cy="316" r="8"/></g>
    <g fill="#017cee"><circle cx="379" cy="422" r="8"/><circle cx="589" cy="118" r="8"/><circle cx="769" cy="118" r="8"/><circle cx="680" cy="400" r="8"/><circle cx="872" cy="400" r="8"/></g>
    <circle cx="300" cy="400" r="8" fill="#b23b3b"/>
    <g fill="#fff"><text x="199" y="136">1</text><text x="199" y="249">2</text><text x="199" y="309">3</text><text x="379" y="136">4</text><text x="379" y="253">5</text><text x="379" y="319">6</text><text x="379" y="425">7</text><text x="300" y="403">8</text><text x="589" y="121">9</text><text x="769" y="121">10</text><text x="680" y="403">11</text><text x="872" y="403">12</text></g>
  </g>

  <!-- ===================== SOURCES ===================== -->
  <rect x="20" y="86" width="165" height="124" rx="6" fill="#fff" stroke="#336791" stroke-width="2"/>
  <text x="32" y="104" font-size="10.5" font-weight="700" fill="#336791">OLTP · stripe_oltp</text>
  <g font-size="9" fill="#495057" font-family="Consolas, 'Courier New', monospace">
    <text x="32" y="121">transactions</text><text x="32" y="135">customers</text><text x="32" y="149">merchants</text><text x="32" y="163">payment_methods</text>
  </g>
  <text x="32" y="181" font-size="8.5" fill="#868e96">partitions mensuelles · email jamais publié</text>
  <text x="32" y="196" font-size="8.5" fill="#868e96">fraud_score écrit au paiement</text>

  <rect x="20" y="222" width="165" height="48" rx="6" fill="#fff" stroke="#868e96" stroke-width="2"/>
  <text x="32" y="240" font-size="10.5" font-weight="700" fill="#495057">API de paiement</text>
  <text x="32" y="256" font-size="8.5" fill="#868e96">features et score de chaque paiement</text>
  <rect x="20" y="282" width="165" height="48" rx="6" fill="#fff" stroke="#868e96" stroke-width="2"/>
  <text x="32" y="300" font-size="10.5" font-weight="700" fill="#495057">Applications</text>
  <text x="32" y="316" font-size="8.5" fill="#868e96">sessions · avis · journaux</text>
  <rect x="20" y="400" width="165" height="44" rx="6" fill="#fff" stroke="#868e96" stroke-width="2"/>
  <text x="32" y="418" font-size="10.5" font-weight="700" fill="#495057">Référence · CSV</text>
  <text x="32" y="434" font-size="8.5" fill="#868e96" font-family="Consolas, 'Courier New', monospace">countries · exchange_rates</text>

  <!-- ===================== KAFKA ===================== -->
  <rect x="215" y="86" width="150" height="244" rx="6" fill="#f3f0ff" stroke="#6b4fa0" stroke-width="2"/>
  <g font-size="8.8" fill="#343a40" font-family="Consolas, 'Courier New', monospace">
    <text x="225" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#4c3a78" font-weight="700">par Debezium</text>
    <text x="225" y="122">cdc.oltp.transactions</text><text x="225" y="135">cdc.oltp.customers</text><text x="225" y="148">cdc.oltp.merchants</text><text x="225" y="161">cdc.oltp.payment_methods</text>
    <text x="225" y="226" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#4c3a78" font-weight="700">par l'API</text>
    <text x="225" y="240">events.risk_features</text><text x="225" y="253">fraud.scores</text>
    <text x="225" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#4c3a78" font-weight="700">par les applications</text>
    <text x="225" y="298">events.sessions</text><text x="225" y="311">events.feedback</text><text x="225" y="324">logs.app</text>
  </g>

  <!-- ===================== RAW + NoSQL ===================== -->
  <rect x="395" y="86" width="180" height="142" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
  <text x="407" y="104" font-size="10.5" font-weight="700" fill="#0b7ea6">Entrepôt · raw (continu)</text>
  <g font-size="9" fill="#495057" font-family="Consolas, 'Courier New', monospace">
    <text x="407" y="121">raw.transactions</text><text x="407" y="135">raw.customers</text><text x="407" y="149">raw.merchants</text><text x="407" y="163">raw.payment_methods</text>
  </g>
  <text x="407" y="182" font-size="8.5" fill="#868e96">+ _loaded_at · upsert sur la clé</text>
  <text x="407" y="196" font-size="8.5" fill="#868e96">offset validé après l'écriture</text>
  <text x="407" y="214" font-size="8.5" fill="#868e96">↔ Snowflake RAW (cible)</text>

  <rect x="395" y="290" width="180" height="100" rx="6" fill="#fff" stroke="#13aa52" stroke-width="2"/>
  <text x="407" y="308" font-size="10.5" font-weight="700" fill="#0f7a3d">MongoDB · stripe_nosql</text>
  <g font-size="9" fill="#495057" font-family="Consolas, 'Courier New', monospace">
    <text x="407" y="325">ml_features</text><text x="407" y="339">user_sessions</text><text x="407" y="353">customer_feedback</text><text x="407" y="367">logs</text>
  </g>
  <text x="407" y="383" font-size="8.5" fill="#868e96">index · purge TTL 30 / 90 / 180 j</text>

  <rect x="395" y="400" width="180" height="44" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
  <text x="407" y="418" font-size="10.5" font-weight="700" fill="#0b7ea6">raw · référentiels (lots)</text>
  <text x="407" y="434" font-size="8.5" fill="#868e96" font-family="Consolas, 'Courier New', monospace">countries · exchange_rates</text>

  <rect x="395" y="452" width="180" height="40" rx="6" fill="#fff5f5" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="407" y="469" font-size="10" font-weight="700" fill="#b23b3b" font-family="Consolas, 'Courier New', monospace">raw._quarantine</text>
  <text x="407" y="484" font-size="8.5" fill="#495057">source · position · brut · raison</text>

  <!-- ===================== STAGING · ML ===================== -->
  <rect x="605" y="86" width="150" height="64" rx="6" fill="#fff" stroke="#ff694a" stroke-width="2"/>
  <text x="617" y="104" font-size="10" font-weight="700" fill="#e8400f" font-family="Consolas, 'Courier New', monospace">stg_transactions</text>
  <text x="617" y="120" font-size="8.5" fill="#495057">vue dbt · montant en USD</text>
  <text x="617" y="133" font-size="8.5" fill="#495057">au taux du jour</text>
  <text x="617" y="145" font-size="8.5" fill="#495057">+ score et version du modèle</text>
  <text x="686" y="196" font-size="8.5" fill="#868e96" font-style="italic">score joint</text>

  <rect x="605" y="236" width="150" height="54" rx="6" fill="#fff" stroke="#0194e2" stroke-width="2"/>
  <text x="617" y="254" font-size="10" font-weight="700" fill="#0277bd" font-family="Consolas, 'Courier New', monospace">ml.fraud_scores</text>
  <text x="617" y="270" font-size="8.5" fill="#495057">score · version · date</text>
  <text x="617" y="283" font-size="8.5" fill="#868e96">chemin synchrone + rattrapage</text>

  <!-- ===================== ANALYTICS ===================== -->
  <rect x="785" y="86" width="175" height="196" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
  <text x="797" y="104" font-size="10.5" font-weight="700" fill="#0b7ea6">Entrepôt · analytics</text>
  <g font-size="9" fill="#495057" font-family="Consolas, 'Courier New', monospace">
    <text x="797" y="121">dim_date</text><text x="797" y="135">dim_customer</text><text x="797" y="149">dim_merchant</text><text x="797" y="163">dim_payment_method</text>
    <text x="797" y="181" font-weight="700" fill="#0b7ea6">fact_transactions</text>
    <text x="797" y="208">agg_revenue_daily</text>
    <text x="797" y="236" font-weight="700" fill="#b23b3b">quarantine_transactions</text>
  </g>
  <text x="797" y="193" font-size="8.5" fill="#868e96">grain = 1 transaction</text>
  <text x="797" y="220" font-size="8.5" fill="#868e96">jour × commerçant</text>
  <text x="797" y="248" font-size="8.5" fill="#868e96">client inconnu, taux manquant…</text>
  <text x="797" y="270" font-size="8.5" fill="#868e96">lecture : data_analyst, ml_scorer</text>

  <!-- ===================== CONSOMMATION ===================== -->
  <text x="20" y="500" font-size="9.5" font-weight="700" fill="#adb5bd" letter-spacing="1">CONTRÔLE ET CONSOMMATION</text>
  <rect x="20" y="505" width="355" height="54" rx="6" fill="#fff" stroke="#e03131" stroke-width="1.5"/>
  <text x="32" y="523" font-size="10.5" font-weight="700" fill="#c92a2a">audit · lecture seule (rôle auditor)</text>
  <text x="32" y="539" font-size="8.5" fill="#495057">compliance_reports (jour) · capacity_reports (heure)</text>
  <text x="32" y="552" font-size="8.5" fill="#495057">alerts : seul le rôle alerter peut y ajouter des lignes</text>
  <rect x="605" y="505" width="150" height="54" rx="6" fill="#fff" stroke="#0194e2" stroke-width="2"/>
  <text x="617" y="523" font-size="10" font-weight="700" fill="#0277bd">rattrapage du score</text>
  <text x="617" y="539" font-size="8.5" fill="#495057">transactions sans score</text>
  <text x="617" y="552" font-size="8.5" fill="#495057">+ features MongoDB</text>
  <rect x="785" y="505" width="175" height="54" rx="6" fill="#fff" stroke="#495057" stroke-width="2"/>
  <text x="797" y="523" font-size="10.5" font-weight="700" fill="#343a40">BI · requêtes SQL</text>
  <text x="797" y="539" font-size="8.5" fill="#495057">revenus · fraude · segmentation</text>
  <text x="797" y="552" font-size="8.5" fill="#495057">rôle data_analyst</text>

  <!-- ===================== LÉGENDE ===================== -->
  <rect x="20" y="572" width="940" height="140" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="34" y="590" font-size="11" font-weight="700" fill="#1a1a2e">Qui déplace quoi, avec quel rôle</text>
  <g font-size="9" fill="#495057">
    <text x="34" y="607"><tspan font-weight="700" fill="#6b4fa0">1</tspan>  Debezium (rôle cdc_reader) : le journal des 4 tables → cdc.oltp.* ; la publication exclut l'email</text>
    <text x="34" y="622"><tspan font-weight="700" fill="#6b4fa0">2</tspan>  API de paiement : features et score de chaque paiement, clé transaction_id</text>
    <text x="34" y="637"><tspan font-weight="700" fill="#6b4fa0">3</tspan>  applications : sessions, avis (clé customer_id) et journaux</text>
    <text x="34" y="652"><tspan font-weight="700" fill="#6b4fa0">4</tspan>  consommateur sink-raw (loader) : upsert dans raw, &lt; 1 min</text>
    <text x="34" y="667"><tspan font-weight="700" fill="#6b4fa0">5</tspan>  consommateur sink-ml (ml_scorer) : fraud.scores → ml.fraud_scores</text>
    <text x="34" y="682"><tspan font-weight="700" fill="#6b4fa0">6</tspan>  consommateur sink-mongodb (el_loader) : upsert dans 4 collections, &lt; 5 s</text>
    <text x="490" y="607"><tspan font-weight="700" fill="#017cee">7</tspan>  référentiels, rechargement complet, chaque ligne contrôlée (loader)</text>
    <text x="490" y="622"><tspan font-weight="700" fill="#b23b3b">8</tspan>  message ou ligne invalide → quarantaine avec sa raison, alerte</text>
    <text x="490" y="637"><tspan font-weight="700" fill="#017cee">9</tspan>  dbt (transformer) : stg_transactions, score rattaché</text>
    <text x="490" y="652"><tspan font-weight="700" fill="#017cee">10</tspan> dbt : dimensions, faits, agrégat, quarantaine métier ; puis dbt test</text>
    <text x="490" y="667"><tspan font-weight="700" fill="#017cee">11</tspan> rattrapage : ml_scorer écrit le score ; fraud_writer le réécrit dans l'OLTP</text>
    <text x="490" y="682"><tspan font-weight="700" fill="#017cee">12</tspan> BI : lit l'étoile uniquement (ni raw, ni ml) · data_analyst</text>
  </g>
  <text x="34" y="703" font-size="9" fill="#868e96" font-style="italic">Violet : voie flux (continu) · bleu : voie lots (Airflow, toutes les 5 min) · rouge pointillé : erreurs mises en quarantaine.</text>
</svg>
