<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Déploiement et supervision — maquette (16 conteneurs) et cible cloud (v2)</title>
  <desc>À gauche, la maquette déployée par Docker Compose : 16 conteneurs regroupés en cluster OLTP (oltp-db, oltp-replica, oltp-router, failover-watchdog), chemin synchrone (app-simulator, scoring-api), voie flux (redpanda, kafka-init, debezium, cdc-init, stream-processor, redpanda-console), stockage et voie lots (warehouse, mongo, mlflow, airflow) ; configuration et supervision en place. À droite, la cible cloud : PostgreSQL 17 avec Patroni sur 3 zones, Kafka managé avec Kafka Connect, service de scoring à mise à l'échelle automatique, Snowflake, MongoDB réparti, stockage objet, Airflow, MLflow et Evidently, déploiement par GitHub Actions, supervision avec seuils et astreinte.</desc>

  <rect width="980" height="760" fill="#f8f9fa" rx="12"/>
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Déploiement et supervision de l'infrastructure (v2)</text>
  <text x="490" y="50" text-anchor="middle" font-size="11" fill="#868e96">Ce qui est déployé et filmé (à gauche) · ce que la cible ajoute pour le volume, la disponibilité et la sécurité (à droite)</text>

  <!-- ===================== MAQUETTE ===================== -->
  <rect x="20" y="62" width="470" height="666" rx="8" fill="#fff" stroke="#495057" stroke-width="1.2"/>
  <text x="34" y="82" font-size="12.5" font-weight="700" fill="#343a40">Maquette déployée · on-premise · 16 conteneurs</text>
  <text x="34" y="97" font-size="9.5" fill="#868e96" font-family="Consolas, 'Courier New', monospace">docker compose up -d --build</text>
  <text x="250" y="97" font-size="9.5" fill="#868e96">Docker Desktop (WSL 2) · réseau privé</text>

  <!-- chips helper style: rect 212x30 -->
  <g font-size="9">
    <!-- A. Cluster OLTP -->
    <rect x="32" y="106" width="446" height="96" rx="6" fill="#f4f7fa" stroke="#336791"/>
    <text x="42" y="122" font-size="10" font-weight="700" fill="#336791">Cluster OLTP · continuité</text>
    <rect x="42" y="128" width="212" height="30" rx="5" fill="#fff" stroke="#336791"/><text x="50" y="141" font-weight="700" fill="#336791">oltp-db</text><text x="50" y="153" fill="#868e96">postgres:17 · port 5435 · primaire au départ</text>
    <rect x="262" y="128" width="208" height="30" rx="5" fill="#fff" stroke="#336791"/><text x="270" y="141" font-weight="700" fill="#336791">oltp-replica</text><text x="270" y="153" fill="#868e96">postgres:17 · port 5437 · synchrone</text>
    <rect x="42" y="164" width="212" height="30" rx="5" fill="#fff" stroke="#017cee" stroke-dasharray="4,2"/><text x="50" y="177" font-weight="700" fill="#015a9c">oltp-router</text><text x="50" y="189" fill="#868e96">↔ HAProxy · une adresse vers le primaire</text>
    <rect x="262" y="164" width="208" height="30" rx="5" fill="#fff" stroke="#868e96" stroke-dasharray="4,2"/><text x="270" y="177" font-weight="700" fill="#495057">failover-watchdog</text><text x="270" y="189" fill="#868e96">↔ Patroni · bascule, isolement</text>

    <!-- B. Synchrone -->
    <rect x="32" y="210" width="446" height="60" rx="6" fill="#fffaf5" stroke="#d9480f"/>
    <text x="42" y="226" font-size="10" font-weight="700" fill="#a63b0b">Chemin synchrone</text>
    <rect x="42" y="232" width="212" height="30" rx="5" fill="#fff" stroke="#868e96" stroke-dasharray="4,2"/><text x="50" y="245" font-weight="700" fill="#495057">app-simulator</text><text x="50" y="257" fill="#868e96">↔ API de paiement · 20 paiements / 30 s</text>
    <rect x="262" y="232" width="208" height="30" rx="5" fill="#fff" stroke="#d9480f"/><text x="270" y="245" font-weight="700" fill="#a63b0b">scoring-api ×1 à ×3</text><text x="270" y="257" fill="#868e96">Flask + gunicorn · ports 8086-8088</text>

    <!-- C. Flux -->
    <rect x="32" y="278" width="446" height="132" rx="6" fill="#faf8fe" stroke="#6b4fa0"/>
    <text x="42" y="294" font-size="10" font-weight="700" fill="#4c3a78">Voie flux</text>
    <rect x="42" y="300" width="212" height="30" rx="5" fill="#fff" stroke="#6b4fa0" stroke-dasharray="4,2"/><text x="50" y="313" font-weight="700" fill="#4c3a78">redpanda</text><text x="50" y="325" fill="#868e96">↔ Kafka · port 19092</text>
    <rect x="262" y="300" width="208" height="30" rx="5" fill="#fff" stroke="#6b4fa0"/><text x="270" y="313" font-weight="700" fill="#4c3a78">debezium</text><text x="270" y="325" fill="#868e96">Debezium 2.7.3 · port 8083</text>
    <rect x="42" y="336" width="212" height="30" rx="5" fill="#fff" stroke="#6b4fa0" stroke-dasharray="4,2"/><text x="50" y="349" font-weight="700" fill="#4c3a78">stream-processor ×1 à ×3</text><text x="50" y="361" fill="#868e96">consommateurs → raw, mongo, quarantaine</text>
    <rect x="262" y="336" width="208" height="30" rx="5" fill="#fff" stroke="#adb5bd"/><text x="270" y="349" font-weight="700" fill="#495057">redpanda-console</text><text x="270" y="361" fill="#868e96">voir les topics · port 8085</text>
    <rect x="42" y="372" width="212" height="30" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="2,2"/><text x="50" y="385" font-weight="700" fill="#868e96">kafka-init</text><text x="50" y="397" fill="#868e96">crée les 7 topics, puis s'arrête</text>
    <rect x="262" y="372" width="208" height="30" rx="5" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="2,2"/><text x="270" y="385" font-weight="700" fill="#868e96">cdc-init</text><text x="270" y="397" fill="#868e96">déclare le connecteur, puis s'arrête</text>

    <!-- D. Stockage et lots -->
    <rect x="32" y="418" width="446" height="96" rx="6" fill="#f3f9ff" stroke="#017cee"/>
    <text x="42" y="434" font-size="10" font-weight="700" fill="#015a9c">Stockage et voie lots</text>
    <rect x="42" y="440" width="212" height="30" rx="5" fill="#fff" stroke="#29b5e8" stroke-dasharray="4,2"/><text x="50" y="453" font-weight="700" fill="#0b7ea6">warehouse</text><text x="50" y="465" fill="#868e96">postgres:16 · 5436 · ↔ Snowflake</text>
    <rect x="262" y="440" width="208" height="30" rx="5" fill="#fff" stroke="#13aa52"/><text x="270" y="453" font-weight="700" fill="#0f7a3d">mongo</text><text x="270" y="465" fill="#868e96">mongo:7 · 27018 · authentification</text>
    <rect x="42" y="476" width="212" height="30" rx="5" fill="#fff" stroke="#0194e2"/><text x="50" y="489" font-weight="700" fill="#0277bd">mlflow</text><text x="50" y="501" fill="#868e96">port 5001 · registre de modèles</text>
    <rect x="262" y="476" width="208" height="30" rx="5" fill="#fff" stroke="#017cee"/><text x="270" y="489" font-weight="700" fill="#015a9c">airflow</text><text x="270" y="501" fill="#868e96">port 8082 · 4 DAG · dbt · pytest</text>
  </g>

  <text x="34" y="534" font-size="10" font-weight="700" fill="#343a40">Configuration</text>
  <g font-size="9" fill="#495057">
    <text x="34" y="549">.env : aucun secret dans le code · un rôle par connexion · secret Debezium dans un fichier</text>
    <text x="34" y="562">init/ : schémas, rôles, slot logique « failover », publication sans email, quarantaine, alertes</text>
  </g>

  <text x="34" y="584" font-size="10" font-weight="700" fill="#343a40">Supervision en place</text>
  <g font-size="9" fill="#495057">
    <text x="34" y="599">• Conteneurs : contrôles de santé Docker, démarrage ordonné, redémarrage automatique</text>
    <text x="34" y="613">• Flux : Redpanda Console, retard des consommateurs (rpk group describe)</text>
    <text x="34" y="627">• OLTP : gardien (rôle de chaque nœud, mode synchrone ou dégradé, bascule)</text>
    <text x="34" y="641">• Capacité : DAG stripe_capacity → audit.capacity_reports (OK, VIGILANCE, AGRANDIR)</text>
    <text x="34" y="655">• Données : dbt source freshness, dbt test, raw._quarantine, quarantaine métier</text>
    <text x="34" y="669">• Modèle : MLflow (métriques, PSI, versions) · conformité : rapport quotidien</text>
    <text x="34" y="683">• Alertes : audit.alerts (INFO, WARNING, CRITICAL) + webhook facultatif</text>
    <text x="34" y="697">• Code : 32 tests automatisés (pytest) + tests dbt</text>
  </g>
  <text x="34" y="718" font-size="9" fill="#868e96" font-style="italic">Bordure pointillée : substitut de même rôle qu'un composant de la cible.</text>

  <!-- ===================== CIBLE ===================== -->
  <rect x="510" y="62" width="450" height="666" rx="8" fill="#fff" stroke="#495057" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="524" y="82" font-size="12.5" font-weight="700" fill="#343a40">Cible · cloud (documentée, non déployée)</text>
  <text x="524" y="97" font-size="9.5" fill="#868e96">même architecture, autre hébergement · 3 zones de disponibilité</text>

  <text x="524" y="120" font-size="9.5" font-weight="700" fill="#adb5bd" letter-spacing="1">VOLUME ET DISPONIBILITÉ</text>
  <g font-size="9">
    <rect x="524" y="128" width="422" height="40" rx="5" fill="#f4f7fa" stroke="#336791"/>
    <text x="534" y="144" font-size="10" font-weight="700" fill="#336791">PostgreSQL 17 · Patroni + etcd + HAProxy</text>
    <text x="534" y="159" fill="#495057">3 nœuds sur 3 zones, quorum synchrone · partitions mensuelles · Citus à 70 %</text>
    <rect x="524" y="174" width="422" height="40" rx="5" fill="#faf8fe" stroke="#6b4fa0"/>
    <text x="534" y="190" font-size="10" font-weight="700" fill="#4c3a78">Kafka managé (Amazon MSK ou Confluent Cloud)</text>
    <text x="534" y="205" fill="#495057">6 brokers · Kafka Connect : Debezium, Snowpipe Streaming, MongoDB · registre de schémas</text>
    <rect x="524" y="220" width="422" height="40" rx="5" fill="#fffaf5" stroke="#d9480f"/>
    <text x="534" y="236" font-size="10" font-weight="700" fill="#a63b0b">Service de scoring · mise à l'échelle automatique</text>
    <text x="534" y="251" fill="#495057">instances ajoutées si p99 &gt; 80 ms ou CPU &gt; 70 % · derrière un répartiteur</text>
    <rect x="524" y="266" width="206" height="40" rx="5" fill="#f2fafd" stroke="#29b5e8"/>
    <text x="534" y="282" font-size="10" font-weight="700" fill="#0b7ea6">Snowflake</text>
    <text x="534" y="297" fill="#495057">un entrepôt virtuel par usage</text>
    <rect x="740" y="266" width="206" height="40" rx="5" fill="#f2fbf5" stroke="#13aa52"/>
    <text x="750" y="282" font-size="10" font-weight="700" fill="#0f7a3d">MongoDB réparti</text>
    <text x="750" y="297" fill="#495057">≈ 16 shards × 3 nœuds · zone UE</text>
    <rect x="524" y="312" width="422" height="40" rx="5" fill="#fff" stroke="#495057"/>
    <text x="534" y="328" font-size="10" font-weight="700" fill="#343a40">Stockage objet S3 · chiffré</text>
    <text x="534" y="343" fill="#495057">pièces de litige (27 To/an) · sauvegardes immuables · copie dans une 2e région</text>
  </g>

  <text x="524" y="376" font-size="9.5" font-weight="700" fill="#adb5bd" letter-spacing="1">ORCHESTRATION, ML, DÉPLOIEMENT</text>
  <g font-size="9">
    <rect x="524" y="384" width="206" height="40" rx="5" fill="#f3f9ff" stroke="#017cee"/>
    <text x="534" y="400" font-size="10" font-weight="700" fill="#015a9c">Airflow</text>
    <text x="534" y="415" fill="#495057">exécuteur distribué · mêmes 4 DAG</text>
    <rect x="740" y="384" width="206" height="40" rx="5" fill="#fff" stroke="#0194e2"/>
    <text x="750" y="400" font-size="10" font-weight="700" fill="#0277bd">MLflow + Evidently</text>
    <text x="750" y="415" fill="#495057">registre, champion, dérive</text>
    <rect x="524" y="430" width="422" height="40" rx="5" fill="#fff" stroke="#495057"/>
    <text x="534" y="446" font-size="10" font-weight="700" fill="#343a40">GitHub Actions + Docker</text>
    <text x="534" y="461" fill="#495057">tests (pytest, dbt test) → image → déploiement · un secret par rôle, dans un coffre</text>
  </g>

  <text x="524" y="494" font-size="9.5" font-weight="700" fill="#adb5bd" letter-spacing="1">SUPERVISION : SEUILS ET ALERTES</text>
  <g font-size="9" fill="#495057">
    <text x="524" y="512"><tspan font-weight="700" fill="#a63b0b">scoring</tspan> : p99 &gt; 80 ms ; décisions par repli &gt; 1 %</text>
    <text x="524" y="527"><tspan font-weight="700" fill="#336791">OLTP</tspan> : bascule ; réplica absent (mode dégradé) ; retard de réplication &gt; 1 s</text>
    <text x="524" y="542"><tspan font-weight="700" fill="#4c3a78">flux</tspan> : connecteur arrêté ; retard des consommateurs &gt; 1 min</text>
    <text x="524" y="557"><tspan font-weight="700" fill="#2f5d8a">capacité</tspan> : &gt; 70 % de 5 000 tx/s → agrandir</text>
    <text x="524" y="572"><tspan font-weight="700" fill="#b23b3b">données</tspan> : toute quarantaine ; &gt; 10 min ; &gt; 1 % du jour</text>
    <text x="524" y="587"><tspan font-weight="700" fill="#015a9c">lots</tspan> : tâche en échec après ses essais ; fraîcheur &gt; 60 min</text>
    <text x="524" y="602"><tspan font-weight="700" fill="#c92a2a">conformité</tspan> : contrôle bloquant en échec</text>
  </g>
  <rect x="524" y="616" width="422" height="58" rx="6" fill="#fff5f5" stroke="#b23b3b"/>
  <text x="536" y="634" font-size="10" font-weight="700" fill="#7d2626">Une seule route pour toutes les alertes</text>
  <text x="536" y="650" font-size="9" fill="#7d2626">journal du service → AUDIT.ALERTS → outil d'astreinte (Slack, PagerDuty)</text>
  <text x="536" y="664" font-size="9" fill="#7d2626">CRITICAL : appel de l'astreinte · WARNING : le jour même · INFO : retour à la normale</text>
  <text x="524" y="700" font-size="9.5" fill="#495057" font-weight="700">Principe : rien n'échoue en silence.</text>
  <text x="524" y="716" font-size="9" fill="#868e96" font-style="italic">Détail : livrable 5 §9 (pannes), §11 (erreurs), §12 (déploiement et supervision).</text>
</svg>
