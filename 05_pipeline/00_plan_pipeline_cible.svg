<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Plan du pipeline de données cible — Stripe (v2) : trois chemins</title>
  <desc>Trois couloirs, un par délai. Chemin synchrone, moins de 100 ms : l'API de paiement calcule les features, appelle le service de scoring, décide (score inférieur à 0,9 accepté, sinon 3-D Secure et revue humaine) et enregistre la transaction avec son score dans l'OLTP ; si le scoring ne répond pas en 300 ms, une règle de repli s'applique et la transaction est scorée plus tard. Voie flux : Debezium lit le journal de l'OLTP et publie dans Kafka (7 topics), avec les événements de l'API et des applications ; Snowpipe Streaming alimente Snowflake RAW en moins d'une minute, un connecteur alimente MongoDB en moins de 5 secondes, les messages invalides vont en quarantaine. Voie lots, Airflow : toutes les 5 minutes Airbyte, dbt run, dbt test, scoring de rattrapage, puis BI ; chaque jour réentraînement et conformité ; chaque heure capacité. Toute erreur : nouvel essai ou quarantaine, puis alerte.</desc>

  <defs>
    <marker id="arrS" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#d9480f" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrF" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#6b4fa0" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#017cee" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#b23b3b" stroke-width="1.6" fill="none"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#f8f9fa" rx="12"/>
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Plan du pipeline de données — Stripe (cible, v2)</text>
  <text x="490" y="50" text-anchor="middle" font-size="11" fill="#868e96">Trois chemins, un par délai · délais exigés par le livrable 0 · transaction_id relie toutes les étapes</text>

  <rect x="20" y="62" width="940" height="28" rx="6" fill="#fdecec" stroke="#e03131"/>
  <text x="34" y="80" font-size="10.5" font-weight="700" fill="#c92a2a">Transversal — Sécurité &amp; conformité :</text>
  <text x="262" y="80" font-size="10.5" fill="#a13030">TLS · RBAC (un rôle par composant) · audit · email jamais publié dans Kafka · aucun numéro de carte</text>

  <!-- ======================= 1. CHEMIN SYNCHRONE ======================= -->
  <rect x="20" y="100" width="940" height="122" rx="8" fill="#fffaf5" stroke="#d9480f" stroke-width="1.5"/>
  <text x="34" y="118" font-size="11.5" font-weight="700" fill="#a63b0b">① CHEMIN SYNCHRONE · décider pendant le paiement · &lt; 100 ms</text>

  <g fill="none" stroke="#d9480f" stroke-width="1.8">
    <path d="M 204,159 H 248" marker-end="url(#arrS)"/>
    <path d="M 420,159 H 464" marker-end="url(#arrS)"/>
    <path d="M 666,159 H 710" marker-end="url(#arrS)"/>
  </g>
  <rect x="34" y="128" width="170" height="62" rx="6" fill="#fff" stroke="#868e96" stroke-width="2"/>
  <text x="119" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#495057">API de paiement</text>
  <text x="119" y="164" text-anchor="middle" font-size="9" fill="#868e96">features : montant, distance,</text>
  <text x="119" y="177" text-anchor="middle" font-size="9" fill="#868e96">vélocité (profil MongoDB)</text>

  <rect x="250" y="128" width="170" height="62" rx="6" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
  <text x="335" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#a63b0b">Service de scoring</text>
  <text x="335" y="164" text-anchor="middle" font-size="9" fill="#495057">modèle champion en mémoire</text>
  <text x="335" y="177" text-anchor="middle" font-size="9" fill="#495057"><tspan font-weight="700">p99 &lt; 100 ms</tspan> · plusieurs instances</text>

  <rect x="466" y="128" width="200" height="62" rx="6" fill="#fff" stroke="#d9480f" stroke-width="2"/>
  <text x="566" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#a63b0b">Décision</text>
  <text x="566" y="164" text-anchor="middle" font-size="9" fill="#495057">score &lt; 0,9 → paiement accepté</text>
  <text x="566" y="177" text-anchor="middle" font-size="9" fill="#495057">≥ 0,9 → 3-D Secure + revue humaine</text>

  <rect x="712" y="128" width="234" height="62" rx="6" fill="#fff" stroke="#336791" stroke-width="2"/>
  <text x="829" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#336791">OLTP · PostgreSQL 17</text>
  <text x="829" y="164" text-anchor="middle" font-size="9" fill="#495057">transaction + score, en une transaction ACID</text>
  <text x="829" y="177" text-anchor="middle" font-size="9" fill="#495057">réplication synchrone · <tspan font-weight="700">RPO 0</tspan></text>

  <text x="34" y="210" font-size="9.5" fill="#a63b0b" font-style="italic">Si le scoring ne répond pas en 300 ms : règle de repli (montant élevé ou forte vélocité → 3-D Secure) ; la transaction est enregistrée sans score et scorée par la voie lots. Le paiement n'attend jamais le modèle.</text>

  <!-- ======================= 2. VOIE FLUX ======================= -->
  <rect x="20" y="232" width="940" height="200" rx="8" fill="#faf8fe" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="34" y="250" font-size="11.5" font-weight="700" fill="#4c3a78">② VOIE FLUX · partager chaque changement · &lt; 1 s vers Kafka, &lt; 1 min vers les destinations</text>

  <g fill="none" stroke="#6b4fa0" stroke-width="1.8">
    <path d="M 184,284 H 212" marker-end="url(#arrF)"/>
    <path d="M 334,284 H 362" marker-end="url(#arrF)"/>
    <path d="M 184,338 H 362" marker-end="url(#arrF)"/>
    <path d="M 614,284 H 658" marker-end="url(#arrF)"/>
    <path d="M 614,338 H 658" marker-end="url(#arrF)"/>
  </g>
  <path d="M 614,395 H 658" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <g font-size="8.5" font-weight="700" fill="#4c3a78" text-anchor="middle" stroke="#faf8fe" stroke-width="3" paint-order="stroke">
    <text x="636" y="278">&lt; 1 min</text>
    <text x="636" y="332">&lt; 5 s</text>
    <text x="636" y="389" fill="#b23b3b">invalide</text>
  </g>

  <rect x="34" y="262" width="150" height="44" rx="6" fill="#fff" stroke="#336791" stroke-width="2"/>
  <text x="109" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#336791">OLTP · journal (WAL)</text>
  <text x="109" y="296" text-anchor="middle" font-size="9" fill="#868e96">4 tables publiées, sans email</text>
  <rect x="34" y="316" width="150" height="44" rx="6" fill="#fff" stroke="#868e96" stroke-width="2"/>
  <text x="109" y="334" text-anchor="middle" font-size="10.5" font-weight="700" fill="#495057">API et applications</text>
  <text x="109" y="350" text-anchor="middle" font-size="9" fill="#868e96">producteurs Kafka</text>

  <rect x="214" y="262" width="120" height="44" rx="6" fill="#f3f0ff" stroke="#6b4fa0" stroke-width="2"/>
  <text x="274" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c3a78">Debezium</text>
  <text x="274" y="296" text-anchor="middle" font-size="9" fill="#495057">CDC · <tspan font-weight="700">&lt; 1 s</tspan></text>

  <rect x="364" y="262" width="250" height="160" rx="6" fill="#f3f0ff" stroke="#6b4fa0" stroke-width="2"/>
  <text x="489" y="281" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c3a78">Apache Kafka · 7 topics</text>
  <g font-size="9" fill="#343a40" font-family="Consolas, 'Courier New', monospace">
    <text x="378" y="300">cdc.oltp.*  (4 tables)</text>
    <text x="378" y="314">events.risk_features</text>
    <text x="378" y="328">fraud.scores</text>
    <text x="378" y="342">events.sessions</text>
    <text x="378" y="356">events.feedback</text>
    <text x="378" y="370">logs.app</text>
  </g>
  <g font-size="8.5" fill="#868e96" text-anchor="end">
    <text x="602" y="300">clé : clé primaire</text>
    <text x="602" y="314">clé : transaction_id</text>
    <text x="602" y="328">clé : transaction_id</text>
    <text x="602" y="342">clé : customer_id</text>
    <text x="602" y="356">clé : customer_id</text>
    <text x="602" y="370">clé : transaction_id</text>
  </g>
  <line x1="376" y1="380" x2="602" y2="380" stroke="#d0c7e8"/>
  <text x="489" y="396" text-anchor="middle" font-size="9" fill="#495057">6 brokers · 3 zones · copies ×3</text>
  <text x="489" y="411" text-anchor="middle" font-size="9" fill="#495057"><tspan font-weight="700">30 Mo/s</tspan> au pic · <tspan font-weight="700">7 jours</tspan> de rejeu</text>

  <rect x="660" y="262" width="286" height="44" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
  <text x="672" y="280" font-size="10.5" font-weight="700" fill="#0b7ea6">Snowflake RAW + ML.FRAUD_SCORES</text>
  <text x="672" y="296" font-size="9" fill="#868e96">Snowpipe Streaming · offset validé après écriture</text>
  <rect x="660" y="316" width="286" height="44" rx="6" fill="#fff" stroke="#13aa52" stroke-width="2"/>
  <text x="672" y="334" font-size="10.5" font-weight="700" fill="#0f7a3d">MongoDB · features, sessions, avis, journaux</text>
  <text x="672" y="350" font-size="9" fill="#868e96">connecteur MongoDB · upsert · profils clients</text>
  <rect x="660" y="372" width="286" height="50" rx="6" fill="#fff5f5" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="672" y="390" font-size="10.5" font-weight="700" fill="#b23b3b">Quarantaine (file d'erreurs)</text>
  <text x="672" y="405" font-size="9" fill="#495057">message mis de côté avec sa raison ; le flux continue</text>
  <text x="672" y="417" font-size="9" fill="#868e96">alerte, correction, puis rejeu</text>

  <text x="34" y="381" font-size="9.5" font-weight="700" fill="#4c3a78">Garanties de livraison</text>
  <g font-size="9" fill="#495057">
    <text x="34" y="396">acks=all : message écrit sur 3 copies</text>
    <text x="34" y="409">offset validé après l'écriture · upsert</text>
    <text x="34" y="422">→ chaque message agit une seule fois</text>
  </g>
  <text x="214" y="330" font-size="8.5" fill="#868e96" stroke="#faf8fe" stroke-width="3" paint-order="stroke">événements JSON</text>

  <!-- ======================= 3. VOIE LOTS ======================= -->
  <rect x="20" y="442" width="940" height="174" rx="8" fill="#f3f9ff" stroke="#017cee" stroke-width="1.5"/>
  <text x="34" y="460" font-size="11.5" font-weight="700" fill="#015a9c">③ VOIE LOTS · calculer, contrôler, apprendre · Apache Airflow · 5 min à 1 jour</text>
  <text x="34" y="478" font-size="9.5" font-weight="700" fill="#1c5b86">stripe_pipeline · toutes les 5 minutes</text>

  <g fill="none" stroke="#017cee" stroke-width="1.8">
    <path d="M 184,511 H 212" marker-end="url(#arrB)"/>
    <path d="M 384,511 H 412" marker-end="url(#arrB)"/>
    <path d="M 614,511 H 642" marker-end="url(#arrB)"/>
    <path d="M 784,511 H 812" marker-end="url(#arrB)"/>
  </g>
  <rect x="34" y="486" width="150" height="50" rx="6" fill="#eef0ff" stroke="#4361ee" stroke-width="2"/>
  <text x="109" y="505" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3730a3">Airbyte</text>
  <text x="109" y="521" text-anchor="middle" font-size="9" fill="#495057">référentiels → RAW</text>
  <rect x="214" y="486" width="170" height="50" rx="6" fill="#fff" stroke="#ff694a" stroke-width="2"/>
  <text x="299" y="505" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e8400f">dbt run</text>
  <text x="299" y="521" text-anchor="middle" font-size="9" fill="#495057">RAW → STAGING → ANALYTICS</text>
  <rect x="414" y="486" width="200" height="50" rx="6" fill="#fff" stroke="#ff694a" stroke-width="2"/>
  <text x="514" y="505" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e8400f">dbt test · barrière qualité</text>
  <text x="514" y="521" text-anchor="middle" font-size="9" fill="#495057">fraîcheur · clés · réconciliation</text>
  <rect x="644" y="486" width="140" height="50" rx="6" fill="#fff" stroke="#0194e2" stroke-width="2"/>
  <text x="714" y="505" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0277bd">Rattrapage</text>
  <text x="714" y="521" text-anchor="middle" font-size="9" fill="#495057">transactions sans score</text>
  <rect x="814" y="486" width="132" height="50" rx="6" fill="#fff" stroke="#495057" stroke-width="2"/>
  <text x="880" y="505" text-anchor="middle" font-size="10.5" font-weight="700" fill="#343a40">BI</text>
  <text x="880" y="521" text-anchor="middle" font-size="9" fill="#495057">données <tspan font-weight="700">&lt; 10 min</tspan></text>

  <rect x="34" y="550" width="296" height="54" rx="6" fill="#fff" stroke="#017cee" stroke-width="1.5"/>
  <text x="46" y="569" font-size="10.5" font-weight="700" fill="#015a9c">stripe_model_retraining · chaque jour</text>
  <text x="46" y="586" font-size="9" fill="#495057">dérive (Evidently) → candidat → promu s'il est meilleur</text>
  <text x="46" y="598" font-size="9" fill="#868e96">MLflow : le scoring recharge le nouveau champion</text>
  <rect x="342" y="550" width="296" height="54" rx="6" fill="#fff" stroke="#017cee" stroke-width="1.5"/>
  <text x="354" y="569" font-size="10.5" font-weight="700" fill="#015a9c">stripe_compliance_daily · chaque jour</text>
  <text x="354" y="586" font-size="9" fill="#495057">6 contrôles bloquants RGPD, PCI-DSS, audit, TLS</text>
  <text x="354" y="598" font-size="9" fill="#868e96">rapport historisé dans AUDIT</text>
  <rect x="650" y="550" width="296" height="54" rx="6" fill="#fff" stroke="#017cee" stroke-width="1.5"/>
  <text x="662" y="569" font-size="10.5" font-weight="700" fill="#015a9c">stripe_capacity · chaque heure</text>
  <text x="662" y="586" font-size="9" fill="#495057">débit de pointe comparé à 5 000 tx/s, retard Kafka</text>
  <text x="662" y="598" font-size="9" fill="#868e96">OK · VIGILANCE (50 %) · AGRANDIR (70 %)</text>

  <!-- ======================= ERREURS ======================= -->
  <rect x="20" y="626" width="940" height="30" rx="6" fill="#fff5f5" stroke="#b23b3b"/>
  <text x="34" y="645" font-size="10" fill="#7d2626"><tspan font-weight="700">À chaque étape :</tspan> erreur passagère → nouvel essai, attente croissante (1 → 30 s) · erreur définitive → quarantaine · tout échec durable → alerte (livrable 5 §11)</text>

  <text x="34" y="682" font-size="9.5" fill="#868e96" font-style="italic">Détail : §5 chemin synchrone · §6 voie flux · §7 voie lots · §8 débits et montée en charge · §9 pannes · §11 erreurs. Maquette : plan 10 · cible et maquette côte à côte : plan 20.</text>
</svg>
