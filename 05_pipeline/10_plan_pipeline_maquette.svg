<svg viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Plan du pipeline construit — maquette on-premise (modèle réduit du plan cible)</title>
  <desc>Même structure que le plan cible 00_pipeline_architecture_globale : sources, ingestion EL, stockage, transformation, exposition, avec Airflow et la sécurité en bandes transversales. Composants identiques à la cible : PostgreSQL OLTP, MongoDB, dbt, MLflow, Airflow. Composants de substitution, en bordure pointillée, qui jouent le même rôle : application simulée (application Stripe), fichiers CSV (référentiels), tâches Python el_sync (Airbyte), entrepôt PostgreSQL couches raw et analytics (Snowflake), requêtes SQL du rôle data_analyst (BI), calcul du PSI (Evidently). DAG principal toutes les 5 minutes : el_sync, dbt_transform, dbt_test_quality, fraud_scoring. DAG quotidiens de réentraînement et de conformité.</desc>

  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#5b6472" stroke-width="1.5" fill="none"/>
    </marker>
    <marker id="arrL" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#adb5bd" stroke-width="1.5" fill="none"/>
    </marker>
    <marker id="arrT" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#017cee" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <rect width="980" height="660" fill="#f8f9fa" rx="12"/>

  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Plan du pipeline de données — Maquette on-premise</text>
  <text x="490" y="50" text-anchor="middle" font-size="11" fill="#868e96">Modèle réduit du plan cible : mêmes étapes, même ordre, mêmes couches · Docker Compose, 6 conteneurs · ce qui tourne dans la vidéo</text>

  <!-- ===== Bande transversale SÉCURITÉ ===== -->
  <rect x="20" y="62" width="940" height="30" rx="6" fill="#fdecec" stroke="#e03131"/>
  <text x="34" y="81" font-size="10.5" font-weight="700" fill="#c92a2a">Transversal — Sécurité &amp; conformité :</text>
  <text x="270" y="81" font-size="10.5" fill="#a13030">1 rôle par tâche (droits jusqu'à la colonne) · audit · pseudonymisation · aucun PAN · rapport quotidien</text>
  <text x="946" y="81" text-anchor="end" font-size="9" font-style="italic" fill="#e08a8a">TLS : cible seulement</text>

  <g transform="translate(0,40)">

    <!-- En-têtes d'étapes -->
    <text x="102" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#adb5bd" letter-spacing="1">SOURCES</text>
    <text x="290" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#adb5bd" letter-spacing="1">INGESTION (EL)</text>
    <text x="477" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#adb5bd" letter-spacing="1">STOCKAGE</text>
    <text x="675" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#adb5bd" letter-spacing="1">TRANSFORMATION (T)</text>
    <text x="877" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#adb5bd" letter-spacing="1">EXPOSITION</text>

    <!-- ===== FLUX DE DONNÉES ===== -->
    <g fill="none" stroke="#5b6472" stroke-width="1.5">
      <path d="M 185,128 L 213,180" marker-end="url(#arr)"/>
      <path d="M 185,198 L 213,198" marker-end="url(#arr)"/>
      <path d="M 185,268 L 213,216" marker-end="url(#arr)"/>
      <path d="M 365,180 L 393,134" marker-end="url(#arr)"/>
      <path d="M 365,214 L 393,222" marker-end="url(#arr)"/>
      <path d="M 560,128 H 588" marker-end="url(#arr)"/>
      <path d="M 675,158 V 178" marker-end="url(#arr)"/>
      <path d="M 760,225 H 793" marker-end="url(#arr)"/>
    </g>
    <text x="570" y="120" font-size="9" fill="#868e96">raw</text>
    <text x="371" y="148" font-size="9" fill="#868e96">load</text>
    <text x="682" y="173" font-size="9" fill="#868e96">build</text>

    <!-- ML : features (entrée) et fraud_score (write-back) -->
    <path d="M 560,226 H 575 V 70 H 877 V 94" fill="none" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrL)"/>
    <text x="700" y="66" font-size="9" fill="#868e96" font-style="italic">features (ml_features)</text>
    <path d="M 795,145 H 778 V 208 H 762" fill="none" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrL)"/>
    <text x="598" y="265" font-size="9" fill="#868e96" font-style="italic">fraud_score → ml.fraud_scores → analytics (+ OLTP)</text>

    <!-- ===== SOURCES ===== -->
    <rect x="20" y="98" width="165" height="60" rx="6" fill="#fff" stroke="#336791" stroke-width="2"/>
    <text x="102" y="120" text-anchor="middle" fill="#336791" font-weight="700" font-size="11.5">OLTP · PostgreSQL 16</text>
    <text x="102" y="136" text-anchor="middle" fill="#868e96" font-size="9.5">conteneur oltp-db</text>
    <text x="102" y="150" text-anchor="middle" fill="#2b8a3e" font-size="9">= cible</text>

    <rect x="20" y="168" width="165" height="60" rx="6" fill="#fff" stroke="#868e96" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="102" y="189" text-anchor="middle" fill="#495057" font-weight="700" font-size="11.5">Application simulée</text>
    <text x="102" y="205" text-anchor="middle" fill="#868e96" font-size="9.5">paiements · événements JSONL</text>
    <text x="102" y="220" text-anchor="middle" fill="#7048e8" font-size="9" font-style="italic">↔ application Stripe</text>

    <rect x="20" y="238" width="165" height="60" rx="6" fill="#fff" stroke="#868e96" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="102" y="259" text-anchor="middle" fill="#495057" font-weight="700" font-size="11.5">Référence · CSV</text>
    <text x="102" y="275" text-anchor="middle" fill="#868e96" font-size="9.5">pays · taux de change</text>
    <text x="102" y="290" text-anchor="middle" fill="#7048e8" font-size="9" font-style="italic">↔ référentiels</text>

    <!-- ===== INGESTION ===== -->
    <rect x="215" y="150" width="150" height="96" rx="6" fill="#eef0ff" stroke="#4361ee" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="290" y="172" text-anchor="middle" fill="#3730a3" font-weight="700" font-size="12.5">el_sync (Python)</text>
    <text x="290" y="189" text-anchor="middle" fill="#4361ee" font-size="9.5">3 tâches Airflow</text>
    <text x="290" y="203" text-anchor="middle" fill="#868e96" font-size="9">incrémental created_at</text>
    <text x="290" y="216" text-anchor="middle" fill="#868e96" font-size="9">full refresh · état du curseur</text>
    <text x="290" y="235" text-anchor="middle" fill="#7048e8" font-size="9" font-style="italic">↔ Airbyte</text>

    <!-- ===== STOCKAGE ===== -->
    <rect x="395" y="98" width="165" height="60" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="477" y="119" text-anchor="middle" fill="#0b7ea6" font-weight="700" font-size="11.5">Entrepôt · schéma raw</text>
    <text x="477" y="135" text-anchor="middle" fill="#868e96" font-size="9.5">PostgreSQL · données brutes</text>
    <text x="477" y="150" text-anchor="middle" fill="#7048e8" font-size="9" font-style="italic">↔ Snowflake RAW</text>

    <rect x="395" y="186" width="165" height="80" rx="6" fill="#fff" stroke="#13aa52" stroke-width="2"/>
    <text x="477" y="208" text-anchor="middle" fill="#0f7a3d" font-weight="700" font-size="12">MongoDB 7</text>
    <text x="477" y="224" text-anchor="middle" fill="#868e96" font-size="9">ml_features · user_sessions</text>
    <text x="477" y="238" text-anchor="middle" fill="#868e96" font-size="9">customer_feedback · logs (TTL)</text>
    <text x="477" y="256" text-anchor="middle" fill="#2b8a3e" font-size="9">= cible</text>

    <!-- ===== TRANSFORMATION ===== -->
    <rect x="590" y="98" width="170" height="60" rx="6" fill="#fff" stroke="#ff694a" stroke-width="2"/>
    <text x="675" y="119" text-anchor="middle" fill="#e8400f" font-weight="700" font-size="12">dbt 1.8</text>
    <text x="675" y="135" text-anchor="middle" fill="#868e96" font-size="9.5">run · source freshness · test</text>
    <text x="675" y="150" text-anchor="middle" fill="#2b8a3e" font-size="9">= cible</text>

    <rect x="590" y="180" width="170" height="70" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="675" y="201" text-anchor="middle" fill="#0b7ea6" font-weight="700" font-size="11.5">Entrepôt · analytics</text>
    <text x="675" y="217" text-anchor="middle" fill="#868e96" font-size="9.5">étoile + agg_revenue_daily</text>
    <text x="675" y="240" text-anchor="middle" fill="#7048e8" font-size="9" font-style="italic">↔ Snowflake ANALYTICS</text>

    <!-- ===== EXPOSITION ===== -->
    <rect x="795" y="96" width="165" height="76" rx="6" fill="#fff" stroke="#0194e2" stroke-width="2"/>
    <text x="877" y="117" text-anchor="middle" fill="#0277bd" font-weight="700" font-size="11.5">Modèle fraude · MLflow</text>
    <text x="877" y="133" text-anchor="middle" fill="#868e96" font-size="9.5">registre · alias « champion »</text>
    <text x="877" y="147" text-anchor="middle" fill="#868e96" font-size="9">dérive : PSI <tspan fill="#7048e8" font-style="italic">(↔ Evidently)</tspan></text>
    <text x="877" y="163" text-anchor="middle" fill="#2b8a3e" font-size="9">= cible (hébergement local)</text>

    <rect x="795" y="190" width="165" height="70" rx="6" fill="#fff" stroke="#495057" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="877" y="212" text-anchor="middle" fill="#343a40" font-weight="700" font-size="12">BI · requêtes SQL</text>
    <text x="877" y="228" text-anchor="middle" fill="#868e96" font-size="9">rôle data_analyst</text>
    <text x="877" y="250" text-anchor="middle" fill="#7048e8" font-size="9" font-style="italic">↔ tableaux de bord</text>

    <!-- ===== ORCHESTRATION : Airflow ===== -->
    <g stroke="#017cee" stroke-width="1.4" stroke-dasharray="5,3" fill="none">
      <path d="M 290,318 V 250" marker-end="url(#arrT)"/>
      <path d="M 675,318 V 254" marker-end="url(#arrT)"/>    </g>
    <rect x="20" y="318" width="940" height="72" rx="8" fill="#e7f5ff" stroke="#017cee" stroke-width="2" stroke-dasharray="7,3"/>
    <text x="34" y="339" fill="#015a9c" font-weight="700" font-size="13">Transversal — Apache Airflow 2.9 (orchestration)   <tspan fill="#2b8a3e" font-size="9" font-weight="400">= cible</tspan></text>
    <text x="34" y="359" fill="#1c5b86" font-size="10.5">stripe_pipeline (toutes les 5 min) : el_sync  →  dbt_transform  →  dbt_test_quality  →  fraud_scoring</text>
    <text x="34" y="378" fill="#4a7fa3" font-size="10">stripe_model_retraining (quotidien) : dérive → candidat → promotion  ·  stripe_compliance_daily (quotidien) : contrôles → alerte</text>
    <text x="946" y="339" text-anchor="end" fill="#74c0fc" font-size="9" font-style="italic">déclenche ↑</text>

    <!-- ===== NOTES ===== -->
    <rect x="20" y="402" width="940" height="200" rx="8" fill="#fff" stroke="#dee2e6"/>
    <text x="34" y="424" font-size="11" font-weight="700" fill="#1a1a2e">Règle de la maquette : les outils peuvent changer, les rôles non</text>
    <text x="34" y="444" font-size="10" fill="#495057">• Identique au plan cible : les 5 étapes, l'ordre du DAG, les couches raw → staging → analytics, la clé de réconciliation transaction_id.</text>
    <text x="34" y="463" font-size="10" fill="#495057">• Mêmes outils que la cible : PostgreSQL (OLTP) · MongoDB · dbt · MLflow · Airflow.</text>
    <text x="34" y="482" font-size="10" fill="#7048e8">• Substitutions déclarées (même rôle, même place) : Snowflake → PostgreSQL · Airbyte → el_sync · Evidently → PSI suivi dans MLflow · BI → requêtes SQL.</text>
    <text x="34" y="501" font-size="10" fill="#495057">• Qualité : dbt source freshness + dbt test, dont la réconciliation RAW ↔ étoile. Échec → le scoring ne s'exécute pas (DAG rouge = alerte).</text>
    <text x="34" y="520" font-size="10" fill="#495057">• Cohérence éventuelle : le score est réécrit tout de suite dans l'OLTP et rejoint l'étoile au passage suivant (5 min au plus).</text>
    <text x="34" y="539" font-size="10" fill="#868e96" font-style="italic">• Non reproduit : TLS et chiffrement au repos · réplication / basculement · montée en charge Snowflake.</text>
    <line x1="34" y1="578" x2="54" y2="578" stroke="#5b6472" stroke-width="1.5"/>
    <text x="60" y="582" font-size="9.5" fill="#868e96">flux de données</text>
    <line x1="150" y1="578" x2="170" y2="578" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="176" y="582" font-size="9.5" fill="#868e96">échange avec le modèle ML</text>
    <line x1="320" y1="578" x2="340" y2="578" stroke="#017cee" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="346" y="582" font-size="9.5" fill="#868e96">orchestration Airflow</text>
    <rect x="460" y="572" width="22" height="12" rx="2" fill="#fff" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="488" y="582" font-size="9.5" fill="#868e96">composant de substitution</text>
    <text x="620" y="582" font-size="9.5" fill="#7048e8" font-style="italic">↔ outil qu'il remplace</text>
    <text x="745" y="582" font-size="9.5" fill="#2b8a3e">= même outil que la cible</text>

  </g>
</svg>
