<svg viewBox="0 0 980 730" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Plan du pipeline de données — maquette (v2) : les trois chemins sur 16 conteneurs</title>
  <desc>Modèle réduit du plan cible : mêmes trois chemins, mêmes topics, mêmes couches, mêmes rôles. Chemin synchrone : app-simulator appelle scoring-api (Flask, 1 à 3 exemplaires, disjoncteur), écrit par oltp-router dans le cluster PostgreSQL 17 (oltp-db primaire, oltp-replica synchrone, failover-watchdog dans le rôle de Patroni). Voie flux : Debezium 2.7 lit le journal et publie dans Redpanda (protocole Kafka) ; stream-processor écrit dans l'entrepôt PostgreSQL (rôle de Snowflake) et dans MongoDB 7, les messages invalides en quarantaine. Voie lots : Airflow et ses 4 DAG (pipeline toutes les 5 minutes, réentraînement, conformité, capacité), dbt, MLflow. Mesures : 288 à 460 transactions par seconde, RAW à jour en moins de 2 secondes, bascule en 9 secondes sans perte, 32 tests.</desc>

  <defs>
    <marker id="arrS" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#d9480f" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrF" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#6b4fa0" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#017cee" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#b23b3b" stroke-width="1.6" fill="none"/>
    </marker>
  </defs>

  <rect width="980" height="730" fill="#f8f9fa" rx="12"/>
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Plan du pipeline de données — maquette on-premise (v2)</text>
  <text x="490" y="50" text-anchor="middle" font-size="11" fill="#868e96">Modèle réduit du plan cible 00 : mêmes chemins, mêmes topics, mêmes couches · Docker Compose, 16 conteneurs · « = » même outil, « ↔ » substitut de même rôle</text>

  <rect x="20" y="62" width="940" height="28" rx="6" fill="#fdecec" stroke="#e03131"/>
  <text x="34" y="80" font-size="10.5" font-weight="700" fill="#c92a2a">Transversal — Sécurité :</text>
  <text x="190" y="80" font-size="10.5" fill="#a13030">un rôle par composant (droits jusqu'à la colonne) · audit · email absent des messages Kafka (0 sur 31) · TLS : cible seulement</text>

  <!-- ======================= 1. SYNCHRONE ======================= -->
  <rect x="20" y="100" width="940" height="122" rx="8" fill="#fffaf5" stroke="#d9480f" stroke-width="1.5"/>
  <text x="34" y="118" font-size="11.5" font-weight="700" fill="#a63b0b">① CHEMIN SYNCHRONE · décider pendant le paiement</text>
  <g fill="none" stroke="#d9480f" stroke-width="1.8">
    <path d="M 204,153 H 248" marker-end="url(#arrS)"/>
    <path d="M 248,168 H 206" marker-end="url(#arrS)"/>
    <path d="M 204,178 V 196 H 450" marker-end="url(#arrS)"/>
  </g>
  <rect x="34" y="128" width="170" height="56" rx="6" fill="#fff" stroke="#868e96" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="119" y="146" text-anchor="middle" font-size="10.5" font-weight="700" fill="#495057">app-simulator</text>
  <text x="119" y="161" text-anchor="middle" font-size="9" fill="#868e96">↔ API de paiement</text>
  <text x="119" y="174" text-anchor="middle" font-size="9" fill="#868e96">disjoncteur · règle de repli</text>

  <rect x="250" y="128" width="170" height="56" rx="6" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
  <text x="335" y="146" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a63b0b">scoring-api</text>
  <text x="335" y="161" text-anchor="middle" font-size="9" fill="#495057">= service de scoring (Flask)</text>
  <text x="335" y="174" text-anchor="middle" font-size="9" fill="#495057">p50 8 ms · p99 12 ms · ×1 à ×3</text>

  <rect x="452" y="128" width="130" height="80" rx="6" fill="#e7f5ff" stroke="#017cee" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="517" y="148" text-anchor="middle" font-size="10.5" font-weight="700" fill="#015a9c">oltp-router</text>
  <text x="517" y="163" text-anchor="middle" font-size="9" fill="#495057">↔ HAProxy</text>
  <text x="517" y="178" text-anchor="middle" font-size="9" fill="#868e96">une adresse,</text>
  <text x="517" y="191" text-anchor="middle" font-size="9" fill="#868e96">toujours le primaire</text>

  <path d="M 582,168 H 606" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrS)"/>
  <rect x="608" y="128" width="338" height="80" rx="6" fill="#fff" stroke="#336791" stroke-width="2"/>
  <text x="620" y="146" font-size="10.5" font-weight="700" fill="#336791">Cluster OLTP · PostgreSQL 17 (= cible)</text>
  <rect x="620" y="154" width="98" height="24" rx="4" fill="#e7edf3" stroke="#336791"/>
  <text x="669" y="170" text-anchor="middle" font-size="9" font-weight="700" fill="#336791">oltp-db</text>
  <path d="M 718,166 H 742" fill="none" stroke="#336791" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="744" y="154" width="98" height="24" rx="4" fill="#e7edf3" stroke="#336791"/>
  <text x="793" y="170" text-anchor="middle" font-size="9" font-weight="700" fill="#336791">oltp-replica</text>
  <rect x="848" y="154" width="90" height="24" rx="4" fill="#f8f9fa" stroke="#868e96" stroke-dasharray="4,2"/>
  <text x="893" y="170" text-anchor="middle" font-size="8.5" font-weight="700" fill="#495057">failover-watchdog</text>
  <text x="620" y="198" font-size="9" fill="#495057">réplication synchrone · gardien ↔ Patroni · <tspan font-weight="700">bascule 9 s, RPO 0</tspan></text>

  <text x="250" y="214" font-size="8.5" fill="#a63b0b" font-style="italic">transaction + score</text>

  <!-- ======================= 2. FLUX ======================= -->
  <rect x="20" y="232" width="940" height="178" rx="8" fill="#faf8fe" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="34" y="250" font-size="11.5" font-weight="700" fill="#4c3a78">② VOIE FLUX · partager chaque changement</text>
  <g fill="none" stroke="#6b4fa0" stroke-width="1.8">
    <path d="M 184,282 H 212" marker-end="url(#arrF)"/>
    <path d="M 334,282 H 362" marker-end="url(#arrF)"/>
    <path d="M 184,336 H 362" marker-end="url(#arrF)"/>
    <path d="M 574,310 H 602" marker-end="url(#arrF)"/>
    <path d="M 764,282 H 792" marker-end="url(#arrF)"/>
    <path d="M 764,330 H 792" marker-end="url(#arrF)"/>
  </g>
  <path d="M 764,378 H 792" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrR)"/>

  <rect x="34" y="260" width="150" height="44" rx="6" fill="#fff" stroke="#336791" stroke-width="2"/>
  <text x="109" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#336791">OLTP · journal (WAL)</text>
  <text x="109" y="294" text-anchor="middle" font-size="9" fill="#868e96">slot cdc_slot « failover »</text>
  <rect x="34" y="314" width="150" height="44" rx="6" fill="#fff" stroke="#868e96" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="109" y="332" text-anchor="middle" font-size="10.5" font-weight="700" fill="#495057">app-simulator</text>
  <text x="109" y="348" text-anchor="middle" font-size="9" fill="#868e96">features, sessions, scores</text>

  <rect x="214" y="260" width="120" height="44" rx="6" fill="#f3f0ff" stroke="#6b4fa0" stroke-width="2"/>
  <text x="274" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c3a78">debezium</text>
  <text x="274" y="294" text-anchor="middle" font-size="9" fill="#495057">= Debezium 2.7</text>

  <rect x="364" y="260" width="210" height="100" rx="6" fill="#f3f0ff" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="469" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#4c3a78">redpanda</text>
  <text x="469" y="294" text-anchor="middle" font-size="9" fill="#495057">↔ Kafka (même protocole), 1 nœud</text>
  <text x="469" y="312" text-anchor="middle" font-size="9" fill="#495057">mêmes 7 topics et mêmes clés</text>
  <text x="469" y="328" text-anchor="middle" font-size="9" fill="#868e96">kafka-init crée les topics</text>
  <text x="469" y="342" text-anchor="middle" font-size="9" fill="#868e96">redpanda-console : les voir passer</text>

  <rect x="604" y="260" width="160" height="100" rx="6" fill="#fff" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="684" y="279" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c3a78">stream-processor</text>
  <text x="684" y="294" text-anchor="middle" font-size="9" fill="#495057">↔ Snowpipe + connecteur</text>
  <text x="684" y="310" text-anchor="middle" font-size="9" fill="#495057">contrôle chaque message</text>
  <text x="684" y="324" text-anchor="middle" font-size="9" fill="#495057">offset validé après écriture</text>
  <text x="684" y="340" text-anchor="middle" font-size="9" fill="#868e96">×1 à ×3 (une partition chacun)</text>

  <rect x="794" y="260" width="152" height="40" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="870" y="277" text-anchor="middle" font-size="10" font-weight="700" fill="#0b7ea6">warehouse · raw</text>
  <text x="870" y="292" text-anchor="middle" font-size="8.5" fill="#868e96">↔ Snowflake RAW · &lt; 2 s</text>
  <rect x="794" y="308" width="152" height="40" rx="6" fill="#fff" stroke="#13aa52" stroke-width="2"/>
  <text x="870" y="325" text-anchor="middle" font-size="10" font-weight="700" fill="#0f7a3d">mongo</text>
  <text x="870" y="340" text-anchor="middle" font-size="8.5" fill="#868e96">= MongoDB 7 · upsert</text>
  <rect x="794" y="356" width="152" height="44" rx="6" fill="#fff5f5" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="870" y="373" text-anchor="middle" font-size="10" font-weight="700" fill="#b23b3b">raw._quarantine</text>
  <text x="870" y="389" text-anchor="middle" font-size="8.5" fill="#495057">message refusé + raison</text>

  <text x="34" y="378" font-size="9.5" font-weight="700" fill="#4c3a78">Mesuré</text>
  <g font-size="9" fill="#495057">
    <text x="34" y="392">consommateur arrêté 1 min : 440 = 440, sans doublon</text>
    <text x="34" y="404">3 messages cassés injectés : 3 en quarantaine, flux continu</text>
  </g>
  <text x="378" y="378" font-size="9" fill="#495057">charge 12 × 500 : <tspan font-weight="700">288 tx/s</tspan> (1 scoring) → <tspan font-weight="700">460 tx/s</tspan> (3 scorings)</text>
  <text x="378" y="392" font-size="9" fill="#495057">après bascule : 0 perte, 0 doublon (offsets réalignés)</text>

  <!-- ======================= 3. LOTS ======================= -->
  <rect x="20" y="420" width="940" height="170" rx="8" fill="#f3f9ff" stroke="#017cee" stroke-width="1.5"/>
  <text x="34" y="438" font-size="11.5" font-weight="700" fill="#015a9c">③ VOIE LOTS · airflow (= Airflow 2.9) · 4 DAG</text>
  <text x="34" y="456" font-size="9.5" font-weight="700" fill="#1c5b86">stripe_pipeline · toutes les 5 minutes</text>
  <g fill="none" stroke="#017cee" stroke-width="1.8">
    <path d="M 184,488 H 212" marker-end="url(#arrB)"/>
    <path d="M 384,488 H 412" marker-end="url(#arrB)"/>
    <path d="M 614,488 H 642" marker-end="url(#arrB)"/>
    <path d="M 784,488 H 812" marker-end="url(#arrB)"/>
  </g>
  <rect x="34" y="464" width="150" height="48" rx="6" fill="#eef0ff" stroke="#4361ee" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="109" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3">reference_files_to_raw</text>
  <text x="109" y="498" text-anchor="middle" font-size="9" fill="#495057">↔ Airbyte · CSV contrôlés</text>
  <rect x="214" y="464" width="170" height="48" rx="6" fill="#fff" stroke="#ff694a" stroke-width="2"/>
  <text x="299" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#e8400f">dbt_transform</text>
  <text x="299" y="498" text-anchor="middle" font-size="9" fill="#495057">= dbt 1.8 · raw → analytics</text>
  <rect x="414" y="464" width="200" height="48" rx="6" fill="#fff" stroke="#ff694a" stroke-width="2"/>
  <text x="514" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#e8400f">dbt_test_quality</text>
  <text x="514" y="498" text-anchor="middle" font-size="9" fill="#495057">tests + quarantaine métier</text>
  <rect x="644" y="464" width="140" height="48" rx="6" fill="#fff" stroke="#0194e2" stroke-width="2"/>
  <text x="714" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#0277bd">fraud_scoring_catch_up</text>
  <text x="714" y="498" text-anchor="middle" font-size="9" fill="#495057">transactions sans score</text>
  <rect x="814" y="464" width="132" height="48" rx="6" fill="#fff" stroke="#495057" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="880" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#343a40">requêtes SQL</text>
  <text x="880" y="498" text-anchor="middle" font-size="9" fill="#495057">↔ BI · data_analyst</text>

  <rect x="34" y="524" width="296" height="54" rx="6" fill="#fff" stroke="#017cee" stroke-width="1.5"/>
  <text x="46" y="542" font-size="10" font-weight="700" fill="#015a9c">stripe_model_retraining · chaque jour</text>
  <text x="46" y="558" font-size="9" fill="#495057">PSI par variable (↔ Evidently) → candidat → promotion</text>
  <text x="46" y="571" font-size="9" fill="#868e96">mlflow (= MLflow) : registre, alias « champion »</text>
  <rect x="342" y="524" width="296" height="54" rx="6" fill="#fff" stroke="#017cee" stroke-width="1.5"/>
  <text x="354" y="542" font-size="10" font-weight="700" fill="#015a9c">stripe_compliance_daily · chaque jour</text>
  <text x="354" y="558" font-size="9" fill="#495057">5 contrôles bloquants, TLS informatif (rôle auditor)</text>
  <text x="354" y="571" font-size="9" fill="#868e96">→ audit.compliance_reports</text>
  <rect x="650" y="524" width="296" height="54" rx="6" fill="#fff" stroke="#017cee" stroke-width="1.5"/>
  <text x="662" y="542" font-size="10" font-weight="700" fill="#015a9c">stripe_capacity · chaque heure</text>
  <text x="662" y="558" font-size="9" fill="#495057">débit de pointe / 290 tx/s (plafond mesuré)</text>
  <text x="662" y="571" font-size="9" fill="#868e96">92 % mesuré → AGRANDIR (tâche en échec)</text>

  <!-- ======================= ERREURS + RÈGLE ======================= -->
  <rect x="20" y="600" width="940" height="30" rx="6" fill="#fff5f5" stroke="#b23b3b"/>
  <text x="34" y="619" font-size="10" fill="#7d2626"><tspan font-weight="700">Erreurs :</tspan> nouvel essai 1 → 30 s · quarantaine · alertes dans audit.alerts · entrepôt arrêté 75 s : 1 000 = 1 000 · <tspan font-weight="700">32 tests automatisés</tspan> au vert</text>

  <rect x="20" y="640" width="940" height="74" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="34" y="658" font-size="11" font-weight="700" fill="#1a1a2e">Règle de la maquette : les outils peuvent changer, les rôles non</text>
  <g font-size="9.5" fill="#495057">
    <text x="34" y="676">• Mêmes outils que la cible : PostgreSQL 17 · Debezium · MongoDB · dbt · MLflow · Airflow. Substituts de même rôle (bordure pointillée) : Redpanda ↔ Kafka · warehouse ↔ Snowflake ·</text>
    <text x="44" y="690">stream-processor ↔ Snowpipe et connecteur MongoDB · reference_files_to_raw ↔ Airbyte · gardien et routeur ↔ Patroni et HAProxy · PSI ↔ Evidently · requêtes SQL ↔ BI.</text>
    <text x="34" y="706" fill="#868e96" font-style="italic">• Non reproduits : TLS et chiffrement au repos · plusieurs brokers et zones · sharding sur plusieurs serveurs · déploiement continu (livrable 5 §13).</text>
  </g>
</svg>
