<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Plan du pipeline — cible et maquette sur une même grille (v2)</title>
  <desc>Chaque boîte a deux étages : en haut l'outil de la cible, en bas ce qui tourne dans la maquette (égal : même outil ; double flèche : substitut de même rôle). Chemin synchrone : API de paiement, service de scoring, décision, HAProxy, cluster PostgreSQL 17 avec Patroni ; dans la maquette app-simulator, scoring-api, même règle, oltp-router, oltp-db et oltp-replica avec un gardien. Voie flux : Debezium identique, Kafka remplacé par Redpanda, Snowpipe Streaming et connecteur MongoDB remplacés par stream-processor, file d'erreurs remplacée par raw._quarantine. Voie lots : Airbyte remplacé par une tâche Python, dbt identique, Snowflake remplacé par PostgreSQL, MLflow identique, Evidently remplacé par le PSI, BI remplacée par des requêtes SQL ; Airflow identique avec les mêmes 4 DAG.</desc>

  <defs>
    <marker id="arrS" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#d9480f" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrF" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#6b4fa0" stroke-width="1.7" fill="none"/>
    </marker>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5.5 L0,10" stroke="#017cee" stroke-width="1.7" fill="none"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#f8f9fa" rx="12"/>
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Plan du pipeline — cible et maquette sur une même grille (v2)</text>
  <text x="490" y="50" text-anchor="middle" font-size="11" fill="#868e96">Chaque boîte : en haut l'outil de la cible · en bas la maquette (« = » même outil · « ↔ » substitut de même rôle, même place)</text>

  <!-- Clé de lecture -->
  <g font-size="9.5">
    <rect x="690" y="60" width="270" height="34" rx="5" fill="#fff" stroke="#adb5bd"/>
    <line x1="690" y1="77" x2="960" y2="77" stroke="#dee2e6"/>
    <text x="700" y="73" font-weight="700" fill="#343a40">cible</text>
    <rect x="691" y="78" width="268" height="15" fill="#f1f3f5"/>
    <text x="700" y="89" fill="#495057">maquette : = même outil · ↔ substitut</text>
  </g>
  <rect x="20" y="62" width="660" height="30" rx="6" fill="#fdecec" stroke="#e03131"/>
  <text x="32" y="75" font-size="9.5" fill="#a13030"><tspan font-weight="700">Sécurité · cible :</tspan> TLS · chiffrement au repos · RBAC · audit · RGPD · PCI-DSS · CCPA</text>
  <text x="32" y="88" font-size="9.5" fill="#a13030"><tspan font-weight="700">maquette :</tspan> = un rôle par composant, audit, email jamais publié · TLS et chiffrement non reproduits</text>

  <!-- ===================== 1. SYNCHRONE ===================== -->
  <rect x="20" y="104" width="940" height="108" rx="8" fill="#fffaf5" stroke="#d9480f" stroke-width="1.5"/>
  <text x="34" y="122" font-size="11.5" font-weight="700" fill="#a63b0b">① CHEMIN SYNCHRONE · &lt; 100 ms</text>
  <g fill="none" stroke="#d9480f" stroke-width="1.8">
    <path d="M 204,164 H 215" marker-end="url(#arrS)"/>
    <path d="M 387,164 H 398" marker-end="url(#arrS)"/>
    <path d="M 570,164 H 581" marker-end="url(#arrS)"/>
    <path d="M 753,164 H 764" marker-end="url(#arrS)"/>
  </g>
  <g font-size="9">
    <rect x="34" y="132" width="170" height="68" rx="6" fill="#fff" stroke="#868e96" stroke-width="2"/>
    <rect x="35" y="173" width="168" height="26" fill="#f1f3f5"/>
    <text x="44" y="149" font-size="10.5" font-weight="700" fill="#495057">API de paiement</text>
    <text x="44" y="163" fill="#868e96">features, décision, écriture</text>
    <text x="44" y="190" fill="#495057">↔ app-simulator</text>

    <rect x="217" y="132" width="170" height="68" rx="6" fill="#fff" stroke="#d9480f" stroke-width="2"/>
    <rect x="218" y="173" width="168" height="26" fill="#f1f3f5"/>
    <text x="227" y="149" font-size="10.5" font-weight="700" fill="#a63b0b">Service de scoring</text>
    <text x="227" y="163" fill="#868e96">instances auto · p99 &lt; 100 ms</text>
    <text x="227" y="190" fill="#495057">= scoring-api (×1 à ×3)</text>

    <rect x="400" y="132" width="170" height="68" rx="6" fill="#fff" stroke="#d9480f" stroke-width="2"/>
    <rect x="401" y="173" width="168" height="26" fill="#f1f3f5"/>
    <text x="410" y="149" font-size="10.5" font-weight="700" fill="#a63b0b">Décision + repli</text>
    <text x="410" y="163" fill="#868e96">seuil 0,9 · repli à 300 ms</text>
    <text x="410" y="190" fill="#495057">= même règle + disjoncteur</text>

    <rect x="583" y="132" width="170" height="68" rx="6" fill="#fff" stroke="#017cee" stroke-width="2"/>
    <rect x="584" y="173" width="168" height="26" fill="#f1f3f5"/>
    <text x="593" y="149" font-size="10.5" font-weight="700" fill="#015a9c">HAProxy</text>
    <text x="593" y="163" fill="#868e96">une adresse vers le primaire</text>
    <text x="593" y="190" fill="#495057">↔ oltp-router</text>

    <rect x="766" y="132" width="180" height="68" rx="6" fill="#fff" stroke="#336791" stroke-width="2"/>
    <rect x="767" y="173" width="178" height="26" fill="#f1f3f5"/>
    <text x="776" y="149" font-size="10.5" font-weight="700" fill="#336791">PostgreSQL 17 + Patroni</text>
    <text x="776" y="163" fill="#868e96">3 nœuds, 3 zones, synchrone</text>
    <text x="776" y="190" fill="#495057">= 2 nœuds · ↔ gardien Python</text>
  </g>

  <!-- ===================== 2. FLUX ===================== -->
  <rect x="20" y="222" width="940" height="108" rx="8" fill="#faf8fe" stroke="#6b4fa0" stroke-width="1.5"/>
  <text x="34" y="240" font-size="11.5" font-weight="700" fill="#4c3a78">② VOIE FLUX · &lt; 1 s vers Kafka, &lt; 1 min vers les destinations</text>
  <g fill="none" stroke="#6b4fa0" stroke-width="1.8">
    <path d="M 204,282 H 215" marker-end="url(#arrF)"/>
    <path d="M 387,282 H 398" marker-end="url(#arrF)"/>
    <path d="M 570,282 H 581" marker-end="url(#arrF)"/>
    <path d="M 753,282 H 764" marker-end="url(#arrF)" stroke="#b23b3b" stroke-dasharray="4,3"/>
  </g>
  <g font-size="9">
    <rect x="34" y="250" width="170" height="68" rx="6" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
    <rect x="35" y="291" width="168" height="26" fill="#f1f3f5"/>
    <text x="44" y="267" font-size="10.5" font-weight="700" fill="#4c3a78">Debezium (CDC)</text>
    <text x="44" y="281" fill="#868e96">journal WAL · slot « failover »</text>
    <text x="44" y="308" fill="#495057">= Debezium 2.7.3</text>

    <rect x="217" y="250" width="170" height="68" rx="6" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
    <rect x="218" y="291" width="168" height="26" fill="#f1f3f5"/>
    <text x="227" y="267" font-size="10.5" font-weight="700" fill="#4c3a78">Apache Kafka</text>
    <text x="227" y="281" fill="#868e96">6 brokers · 7 topics · 7 jours</text>
    <text x="227" y="308" fill="#495057">↔ Redpanda (même protocole)</text>

    <rect x="400" y="250" width="170" height="68" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
    <rect x="401" y="291" width="168" height="26" fill="#f1f3f5"/>
    <text x="410" y="267" font-size="10.5" font-weight="700" fill="#0b7ea6">Snowpipe → RAW</text>
    <text x="410" y="281" fill="#868e96">Snowflake · &lt; 1 min</text>
    <text x="410" y="308" fill="#495057">↔ stream-processor → raw</text>

    <rect x="583" y="250" width="170" height="68" rx="6" fill="#fff" stroke="#13aa52" stroke-width="2"/>
    <rect x="584" y="291" width="168" height="26" fill="#f1f3f5"/>
    <text x="593" y="267" font-size="10.5" font-weight="700" fill="#0f7a3d">Connecteur → MongoDB</text>
    <text x="593" y="281" fill="#868e96">upsert · &lt; 5 s · réparti</text>
    <text x="593" y="308" fill="#495057">↔ stream-processor · = mongo:7</text>

    <rect x="766" y="250" width="180" height="68" rx="6" fill="#fff5f5" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6,3"/>
    <rect x="767" y="291" width="178" height="26" fill="#f1f3f5"/>
    <text x="776" y="267" font-size="10.5" font-weight="700" fill="#b23b3b">File d'erreurs (quarantaine)</text>
    <text x="776" y="281" fill="#868e96">Kafka Connect + RAW._QUARANTINE</text>
    <text x="776" y="308" fill="#495057">↔ raw._quarantine</text>
  </g>

  <!-- ===================== 3. LOTS ===================== -->
  <rect x="20" y="340" width="940" height="160" rx="8" fill="#f3f9ff" stroke="#017cee" stroke-width="1.5"/>
  <text x="34" y="358" font-size="11.5" font-weight="700" fill="#015a9c">③ VOIE LOTS · 5 min à 1 jour</text>
  <g fill="none" stroke="#017cee" stroke-width="1.8">
    <path d="M 204,400 H 215" marker-end="url(#arrB)"/>
    <path d="M 387,400 H 398" marker-end="url(#arrB)"/>
    <path d="M 570,400 H 581" marker-end="url(#arrB)"/>
    <path d="M 753,400 H 764" marker-end="url(#arrB)"/>
  </g>
  <g font-size="9">
    <rect x="34" y="368" width="170" height="68" rx="6" fill="#fff" stroke="#4361ee" stroke-width="2"/>
    <rect x="35" y="409" width="168" height="26" fill="#f1f3f5"/>
    <text x="44" y="385" font-size="10.5" font-weight="700" fill="#3730a3">Airbyte</text>
    <text x="44" y="399" fill="#868e96">référentiels, quotidien</text>
    <text x="44" y="426" fill="#495057">↔ reference_files_to_raw</text>

    <rect x="217" y="368" width="170" height="68" rx="6" fill="#fff" stroke="#ff694a" stroke-width="2"/>
    <rect x="218" y="409" width="168" height="26" fill="#f1f3f5"/>
    <text x="227" y="385" font-size="10.5" font-weight="700" fill="#e8400f">dbt run + dbt test</text>
    <text x="227" y="399" fill="#868e96">incrémental · barrière qualité</text>
    <text x="227" y="426" fill="#495057">= dbt 1.8, mêmes modèles</text>

    <rect x="400" y="368" width="170" height="68" rx="6" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
    <rect x="401" y="409" width="168" height="26" fill="#f1f3f5"/>
    <text x="410" y="385" font-size="10.5" font-weight="700" fill="#0b7ea6">Snowflake ANALYTICS</text>
    <text x="410" y="399" fill="#868e96">étoile · entrepôt par usage</text>
    <text x="410" y="426" fill="#495057">↔ PostgreSQL, mêmes tables</text>

    <rect x="583" y="368" width="170" height="68" rx="6" fill="#fff" stroke="#0194e2" stroke-width="2"/>
    <rect x="584" y="409" width="168" height="26" fill="#f1f3f5"/>
    <text x="593" y="385" font-size="10.5" font-weight="700" fill="#0277bd">MLflow + Evidently</text>
    <text x="593" y="399" fill="#868e96">champion · dérive</text>
    <text x="593" y="426" fill="#495057">= MLflow · ↔ PSI par variable</text>

    <rect x="766" y="368" width="180" height="68" rx="6" fill="#fff" stroke="#495057" stroke-width="2"/>
    <rect x="767" y="409" width="178" height="26" fill="#f1f3f5"/>
    <text x="776" y="385" font-size="10.5" font-weight="700" fill="#343a40">BI / tableaux de bord</text>
    <text x="776" y="399" fill="#868e96">données de moins de 10 min</text>
    <text x="776" y="426" fill="#495057">↔ requêtes SQL (data_analyst)</text>
  </g>
  <rect x="34" y="446" width="912" height="44" rx="6" fill="#e7f5ff" stroke="#017cee" stroke-dasharray="7,3"/>
  <text x="46" y="464" font-size="10.5" font-weight="700" fill="#015a9c">Apache Airflow <tspan font-weight="400" fill="#1c5b86">= même outil (2.9) · mêmes 4 DAG : stripe_pipeline (5 min) · stripe_model_retraining · stripe_compliance_daily · stripe_capacity (heure)</tspan></text>
  <text x="46" y="480" font-size="9.5" fill="#1c5b86">mêmes règles d'erreur : nouvel essai avec attente croissante, délai maximal par tâche, alerte après la dernière tentative</text>

  <!-- ===================== POINTS CLÉS ===================== -->
  <rect x="20" y="512" width="940" height="190" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="34" y="532" font-size="11" font-weight="700" fill="#1a1a2e">Ce qui est identique, ce qui change, ce qui manque</text>
  <g font-size="9.8" fill="#495057">
    <text x="34" y="552">• <tspan font-weight="700">Identique</tspan> : les trois chemins et leur ordre, les 7 topics et leurs clés, les couches raw → staging → analytics, les rôles, les tests, la clé transaction_id.</text>
    <text x="34" y="570">• <tspan font-weight="700">Même outil</tspan> (=) : PostgreSQL 17, Debezium, MongoDB, dbt, MLflow, Airflow.</text>
    <text x="34" y="588">• <tspan font-weight="700">Substitut de même rôle</tspan> (↔) : Redpanda, stream-processor, warehouse PostgreSQL, gardien et routeur Python, tâche Python des référentiels, PSI, requêtes SQL.</text>
    <text x="44" y="604">Raison commune : un service cloud payant ou trop lourd pour un poste de travail ; le comportement démontré reste le même.</text>
    <text x="34" y="622">• <tspan font-weight="700">Démontré dans la maquette</tspan> : flux en moins de 2 s · 288 → 460 tx/s · bascule 9 s sans perte · quarantaine et alertes · 32 tests automatisés.</text>
    <text x="34" y="640" fill="#868e96">• <tspan font-weight="700">Non reproduit</tspan> : TLS et chiffrement au repos · plusieurs brokers et zones · sharding sur plusieurs serveurs · registre de schémas · déploiement continu.</text>
  </g>
  <g font-size="9.5" fill="#495057">
    <line x1="34" y1="672" x2="58" y2="672" stroke="#d9480f" stroke-width="2"/><text x="64" y="676">chemin synchrone</text>
    <line x1="190" y1="672" x2="214" y2="672" stroke="#6b4fa0" stroke-width="2"/><text x="220" y="676">voie flux</text>
    <line x1="300" y1="672" x2="324" y2="672" stroke="#017cee" stroke-width="2"/><text x="330" y="676">voie lots</text>
    <line x1="410" y1="672" x2="434" y2="672" stroke="#b23b3b" stroke-width="2" stroke-dasharray="4,3"/><text x="440" y="676">erreurs mises de côté</text>
  </g>
  <text x="34" y="694" font-size="9" fill="#868e96" font-style="italic">Plans séparés : 00 (cible) · 10 (maquette). Correspondance détaillée : livrable 5 §13 et maquette/README.md §1.</text>
</svg>
