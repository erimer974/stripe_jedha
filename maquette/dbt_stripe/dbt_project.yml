name: 'dbt_stripe'
version: '2.0.0'
config-version: 2

profile: 'dbt_stripe'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  dbt_stripe:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: analytics
      # Moindre privilège : seuls la BI (data_analyst) et le scoring (ml_scorer) lisent l'étoile
      +grants:
        select: ['data_analyst', 'ml_scorer']
