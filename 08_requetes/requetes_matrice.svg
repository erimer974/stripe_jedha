<svg viewBox="0 0 960 730" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Requêtes métier — matrice question, système, technique</title>
  <desc>22 requêtes qui répondent aux questions métier de Stripe (revenus, fraude, segmentation, performance, opérationnel, conformité), chacune posée au système adapté : OLAP Snowflake pour l'analytique (Q1 à Q5, Q9 à Q14), OLTP PostgreSQL pour l'opérationnel (Q6 à Q8), MongoDB pour les données semi-structurées (N1 à N8). La dernière colonne indique si la requête est exécutée dans la maquette ; N8 porte sur une collection de l'architecture cible uniquement.</desc>

  <rect width="960" height="730" fill="#f8f9fa" rx="12"/>

  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Requêtes métier — SQL &amp; NoSQL</text>
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="#868e96">Chaque question posée au système conçu pour y répondre · analytique → OLAP · opérationnel → OLTP · semi-structuré → NoSQL</text>

  <g font-size="10" font-weight="700" fill="#868e96">
    <text x="48" y="82">#</text>
    <text x="84" y="82">QUESTION MÉTIER</text>
    <text x="370" y="82">DOMAINE</text>
    <text x="560" y="82">SYSTÈME</text>
    <text x="680" y="82">TECHNIQUE CLÉ</text>
    <text x="912" y="82" text-anchor="end">MAQUETTE</text>
  </g>
