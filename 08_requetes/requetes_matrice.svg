  <text x="370" y="111" font-size="10" fill="#495057">Revenus</text>
  <rect x="553" y="98" width="112" height="18" rx="9" fill="#e3f4fb"/><text x="609" y="110" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0b7ea6">OLAP · Snowflake</text>
  <text x="680" y="111" font-size="10" fill="#495057">JOIN faits × dims + GROUP BY</text>
  <text x="890" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44">✓</text>
  <text x="48" y="137" font-size="10.5" fill="#868e96" font-weight="700">Q2</text>
  <text x="84" y="137" font-size="10.5" fill="#212529">Taux de fraude par segment client</text>
  <text x="370" y="137" font-size="10" fill="#495057">Fraude · segmentation</text>
  <rect x="553" y="124" width="112" height="18" rx="9" fill="#e3f4fb"/><text x="609" y="136" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0b7ea6">OLAP · Snowflake</text>
  <text x="680" y="137" font-size="10" fill="#495057">AVG(CASE …) par segment</text>
  <text x="890" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44">✓</text>
  <rect x="40" y="146" width="880" height="26" fill="#ffffff"/>
  <text x="48" y="163" font-size="10.5" fill="#868e96" font-weight="700">Q3</text>
  <text x="84" y="163" font-size="10.5" fill="#212529">Revenus quotidiens lus dans le pré-agrégat</text>
  <text x="370" y="163" font-size="10" fill="#495057">Revenus</text>
  <rect x="553" y="150" width="112" height="18" rx="9" fill="#e3f4fb"/><text x="609" y="162" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0b7ea6">OLAP · Snowflake</text>
  <text x="680" y="163" font-size="10" fill="#495057">lecture de agg_revenue_daily</text>
