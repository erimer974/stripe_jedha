  <!-- ============ AGG_REVENUE_DAILY ============ -->
  <rect x="700" y="640" width="220" height="164" rx="6" fill="#fff" stroke="#868e96" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="700" y="640" width="220" height="28" rx="6" fill="#868e96"/>
  <rect x="700" y="660" width="220" height="8" fill="#868e96"/>
  <text x="810" y="659" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">agg_revenue_daily</text>
