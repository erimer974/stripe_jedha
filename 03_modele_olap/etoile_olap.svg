  <text x="727" y="90" font-size="11" font-weight="700" fill="#0b7ea6">Couches Snowflake (cible)</text>
  <text x="727" y="112" font-size="10" font-weight="700" fill="#495057">RAW</text>
  <text x="780" y="112" font-size="9.5" fill="#868e96">copie brute des sources</text>
  <text x="727" y="134" font-size="10" font-weight="700" fill="#495057">STAGING</text>
  <text x="780" y="134" font-size="9.5" fill="#868e96">vues préparées (dbt)</text>
  <text x="727" y="156" font-size="10" font-weight="700" fill="#0b7ea6">ANALYTICS</text>
  <text x="800" y="156" font-size="9.5" fill="#868e96">étoile + agrégat</text>
  <text x="727" y="178" font-size="10" font-weight="700" fill="#495057">ML</text>
  <text x="780" y="178" font-size="9.5" fill="#868e96">fraud_scores (modèle)</text>
  <text x="727" y="200" font-size="10" font-weight="700" fill="#495057">AUDIT</text>
  <text x="780" y="200" font-size="9.5" fill="#868e96">rapports de conformité</text>
  <text x="727" y="226" font-size="9.5" fill="#868e96" font-style="italic">Lecture de l'étoile : rôles BI</text>
  <text x="727" y="241" font-size="9.5" fill="#868e96" font-style="italic">et scoring uniquement (livrable 6)</text>

