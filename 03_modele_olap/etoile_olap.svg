  <text x="382" y="740" fill="#495057">label</text>
  <text x="600" y="740" text-anchor="end" fill="#868e96" font-size="10">VARCHAR(50)</text>

  <!-- ============ FACT_TRANSACTIONS ============ -->
  <rect x="360" y="290" width="260" height="330" rx="6" fill="#fff" stroke="#3b5bdb" stroke-width="2.5"/>
  <rect x="360" y="290" width="260" height="30" rx="6" fill="#3b5bdb"/>
  <rect x="360" y="312" width="260" height="8" fill="#3b5bdb"/>
