<svg viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif" font-size="12" style="background:#f8f9fa">
  <title>Schéma OLAP en étoile — Stripe (Snowflake, architecture cible)</title>
  <desc>Schéma en étoile de la couche ANALYTICS de Snowflake. Au centre, la table de faits fact_transactions (grain : une transaction) avec ses clés vers quatre dimensions, ses dimensions dégénérées (transaction_id, devise, statut, appareil, version du modèle), ses mesures (montant en USD, score de fraude) et ses attributs (indicateur de fraude, horodatage). Autour : dim_date, dim_customer (pays, segment de valeur), dim_merchant, dim_payment_method. Pré-agrégat agg_revenue_daily dérivé des faits, par jour et par commerçant. Encadré des couches Snowflake : RAW, STAGING, ANALYTICS, ML, AUDIT. Notation patte-d'oie dimension (1) vers faits (N).</desc>

  <defs>
    <marker id="crow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,7 L11,1 M0,7 L11,13 M0,7 L11,7" stroke="#5b6472" stroke-width="1.4" fill="none"/>
    </marker>
    <marker id="one" markerWidth="20" markerHeight="16" refX="0" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="10" y1="2" x2="10" y2="14" stroke="#5b6472" stroke-width="1.8"/>
    </marker>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,6 L0,11" stroke="#adb5bd" stroke-width="1.4" fill="none"/>
    </marker>
  </defs>

  <rect width="960" height="820" fill="#f8f9fa" rx="12"/>

  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Schéma OLAP en étoile — Stripe (Snowflake · couche ANALYTICS)</text>
  <text x="480" y="54" text-anchor="middle" font-size="11" fill="#868e96">Architecture cible · 1 table de faits · 4 dimensions dénormalisées · grain = 1 transaction · construit et testé par dbt</text>

  <!-- ============ CONNECTEURS ============ -->
  <g fill="none" stroke="#5b6472" stroke-width="1.4">
    <path d="M 490,252 V 290" marker-start="url(#one)" marker-end="url(#crow)"/>
    <path d="M 245,376 H 360" marker-start="url(#one)" marker-end="url(#crow)"/>
    <path d="M 715,396 H 620" marker-start="url(#one)" marker-end="url(#crow)"/>
    <path d="M 490,670 V 620" marker-start="url(#one)" marker-end="url(#crow)"/>
  </g>
  <path d="M 620,590 H 660 V 700 H 700" fill="none" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="666" y="650" font-size="9.5" fill="#868e96" font-style="italic">agrégat</text>
  <text x="666" y="663" font-size="9.5" fill="#868e96" font-style="italic">(dbt)</text>

  <!-- ============ LÉGENDE ============ -->
  <rect x="40" y="70" width="215" height="186" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="52" y="90" font-size="11" font-weight="700" fill="#1a1a2e">Légende</text>
  <rect x="52" y="98" width="12" height="12" fill="#3b5bdb" rx="2"/>
  <text x="72" y="108" font-size="10" fill="#495057">Table de faits</text>
  <rect x="52" y="116" width="12" height="12" fill="#2f9e44" rx="2"/>
  <text x="72" y="126" font-size="10" fill="#495057">Dimension</text>
  <text x="52" y="144" font-size="10" fill="#e03131" font-weight="700">FK</text>
  <text x="76" y="144" font-size="10" fill="#495057">Clé vers une dimension</text>
  <text x="52" y="160" font-size="10" fill="#868e96" font-weight="700">DD</text>
  <text x="76" y="160" font-size="10" fill="#495057">Dimension dégénérée</text>
  <text x="52" y="176" font-size="10" fill="#e8590c" font-weight="700">M</text>
  <text x="76" y="176" font-size="10" fill="#495057">Mesure</text>
  <text x="52" y="192" font-size="10" fill="#7048e8" font-weight="700">A</text>
  <text x="76" y="192" font-size="10" fill="#495057">Attribut de la transaction</text>
  <line x1="54" y1="210" x2="86" y2="210" stroke="#5b6472" stroke-width="1.4"/>
  <line x1="60" y1="204" x2="60" y2="216" stroke="#5b6472" stroke-width="1.8"/>
  <path d="M86,210 L94,205 M86,210 L94,215 M86,210 L94,210" stroke="#5b6472" stroke-width="1.4" fill="none"/>
  <text x="100" y="214" font-size="10" fill="#495057">dimension 1 — N faits</text>
  <line x1="54" y1="234" x2="86" y2="234" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="94" y="238" font-size="10" fill="#495057">table dérivée</text>

