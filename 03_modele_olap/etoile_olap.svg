  <text x="712" y="730" fill="#e8590c" font-weight="700" font-size="10">M</text>
  <text x="736" y="730" fill="#495057">total_revenue_usd</text>
  <text x="712" y="750" fill="#e8590c" font-weight="700" font-size="10">M</text>
  <text x="736" y="750" fill="#495057">nb_transactions</text>
  <text x="712" y="770" fill="#e8590c" font-weight="700" font-size="10">M</text>
  <text x="736" y="770" fill="#495057">nb_scored</text>
  <text x="712" y="790" fill="#e8590c" font-weight="700" font-size="10">M</text>
  <text x="736" y="790" fill="#495057">nb_flagged_fraud</text>

  <!-- ============ NOTES ============ -->
  <rect x="40" y="480" width="300" height="300" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="52" y="500" font-size="11" font-weight="700" fill="#1a1a2e">Choix de modélisation</text>
  <g font-size="10" fill="#495057">
    <text x="52" y="520">• Étoile : une jointure par axe, sur des clés entières</text>
    <text x="52" y="538">• Grain le plus fin : agrégeable sur tous les axes</text>
    <text x="52" y="556">• Montants convertis en USD au taux en vigueur</text>
    <text x="52" y="574">&#160;&#160;à la date de la transaction</text>
    <text x="52" y="592">• transaction_id (DD) : réconciliation OLTP / NoSQL</text>
    <text x="52" y="610">• Micro-partitions regroupées par date (CLUSTER BY)</text>
    <text x="52" y="628">• agg_revenue_daily : pré-agrégat lu par la BI</text>
    <text x="52" y="646">• Score et version du modèle rattachés depuis ML</text>
    <text x="52" y="664">• segment : valeur cumulée en USD (3 niveaux)</text>
    <text x="52" y="682">• Aucune donnée personnelle directe (pas d'email)</text>
    <text x="52" y="700">• Qualité : unicité, non-nullité, relations, valeurs</text>
    <text x="52" y="718">&#160;&#160;admises, réconciliation RAW ↔ étoile (dbt test)</text>
  </g>
  <text x="52" y="746" font-size="9.5" fill="#868e96" font-style="italic">Maquette : mêmes tables et colonnes, construites par</text>
  <text x="52" y="761" font-size="9.5" fill="#868e96" font-style="italic">dbt dans PostgreSQL (schéma analytics).</text>
</svg>
